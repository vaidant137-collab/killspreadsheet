# Render blueprint. Connect this repo at render.com and it reads this file --
# no terminal, no CLI.
services:
  - type: web
    name: killspreadsheet
    runtime: python
    plan: free
    buildCommand: bash build.sh
    startCommand: bash start.sh
    healthCheckPath: /healthz
    envVars:
      # Python 3.11 so none of the 3.9 union-syntax issues can recur on the host.
      - key: PYTHON_VERSION
        value: "3.11.9"
      # The build records a real extraction run; the runtime replays it. This
      # only matters if the database is missing at boot, which on Render it is
      # not -- build.sh made it. "replay" rather than "fixture" so that even the
      # fallback path serves the real run rather than a stand-in.
      - key: EXTRACTOR
        value: replay
      # Set in the Render dashboard, never in the repo. Without it the site
      # still works -- only the live analyst chat needs it.
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_ANALYST_MODEL
        value: anthropic/claude-sonnet-5
      # Extraction was defaulting to a free vision model that could not finish
      # five documents inside the build's 420-second ceiling, so every deploy
      # fell back to the fixture path and the header said so. Naming a fast
      # vision model here is what makes the honest chip say "extraction by a
      # model" instead. Two models, one provider, set independently -- which is
      # the argument config.py makes, now being used for its actual purpose.
      - key: OPENROUTER_EXTRACT_MODEL
        value: anthropic/claude-sonnet-5
      # A ceiling, not a target. Measured, the five documents are ~15,500
      # output tokens, which is four or five minutes of generation; ten gives
      # room for one document to need a schema repair without costing the
      # deploy its provenance. About twenty cents a deploy at these rates.
      - key: EXTRACT_BUDGET_S
        value: "700"
      # Per model call. The default 90 seconds is comfortable for a page of
      # text and not for a photographed rate card: a build where all five
      # documents timed out at 90s, fell back one at a time and still exited
      # zero is exactly what shipped the fixture path while the log said
      # "recording a real model run". Five documents at 150 still fit the
      # budget above with room to spare.
      - key: LLM_TIMEOUT_S
        value: "150"
      # A public URL with a paid key behind it needs a ceiling. See api/app.py.
      - key: MAX_QUESTIONS_PER_HOUR
        value: "60"
