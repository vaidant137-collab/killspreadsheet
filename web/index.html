<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kill the Quote Spreadsheet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:wght@400;500&family=Public+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* ---------------------------------------------------------------------------
   ONE COLUMN.

   This screen used to be a chat with a pinned artifact above it and six tabs
   inside that artifact. Everything the buyer needed was on screen and none of
   it was where they were looking: the comparison they had just waited for was
   behind a tab, the item master was a place you went rather than a step you
   took, and the conversation scrolled underneath all of it.

   So: one column, top to bottom, in the order the work happens. Choosing line
   items is a card. The covering mail is a card. The round is a card that fills
   in as replies land. The price table is a card — in the conversation, not
   behind a control — and under it, in words, what it means and what to do.
   Nothing is hidden behind a tab, because there are no tabs.
--------------------------------------------------------------------------- */
:root{
  --paper:#F1F0EC; --surface:#FAFAF8; --surface-2:#E8E7E1; --ink:#16191C;
  --ink-soft:#585F66; --ink-faint:#8B9198; --rule:#D8D6CE; --rule-soft:#E4E2DA;
  --accent:#17416B; --accent-soft:#E2EAF2;
  --ok:#2F6F4E; --derived:#8A6110; --derived-bg:#F6EEDC; --derived-line:#D9BC7A;
  --risk:#9E2C2C; --risk-bg:#F7E6E4; --risk-line:#DFA9A3;
  --dim:var(--ink-soft); --warn:var(--derived); --good:var(--ok);
  --rank:#5B8DB8;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --paper:#14171A; --surface:#1B1F23; --surface-2:#23282D; --ink:#E7E5DF;
  --ink-soft:#A3AAB1; --ink-faint:#6F777E; --rule:#2C3237; --rule-soft:#242A2F;
  --accent:#7FADD6; --accent-soft:#1D2A38;
  --ok:#79BF97; --derived:#D6AC5E; --derived-bg:#2B2415; --derived-line:#6B5A2F;
  --risk:#E08B84; --risk-bg:#301E1C; --risk-line:#6E3B36;
  --rank:#5E8CB4; color-scheme:dark;}}
*{box-sizing:border-box}
/* A class selector with `display` outranks the UA's [hidden] rule, so el.hidden
   silently does nothing — which is how a finished step card kept showing its
   "Continue" button underneath its own summary. Say it once, loudly. */
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);
  font-family:"Public Sans",system-ui,sans-serif;font-size:14px;line-height:1.55;
  -webkit-font-smoothing:antialiased;display:flex;flex-direction:column}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace}
button{font-family:inherit}

/* ---------- header ---------- */
header{border-bottom:1px solid var(--rule);background:var(--surface);
  padding:11px 20px;display:flex;gap:16px;align-items:baseline;flex-wrap:wrap;flex:none}
header h1{font-family:Newsreader,Georgia,serif;font-weight:500;font-size:1.1rem;margin:0;
  letter-spacing:-.01em;white-space:nowrap}
header .meta{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.05em;
  text-transform:uppercase;color:var(--ink-faint);display:flex;gap:14px;flex-wrap:wrap}
header .spacer{flex:1}
.chip{font-family:"IBM Plex Mono",monospace;font-size:10.5px;font-weight:600;
  padding:3px 8px;border-radius:2px;letter-spacing:.04em;cursor:pointer;border:0}
.chip.warn{background:var(--derived-bg);color:var(--derived)}
.chip.risk{background:var(--risk-bg);color:var(--risk)}
.chip.plain{background:none;color:var(--ink-faint);border:1px solid var(--rule)}
.chip.plain:hover{color:var(--ink)}

/* ---------- the column ---------- */
/* No smooth scrolling here. It looks nice and it keeps emitting scroll events
   for a third of a second after the gesture that caused it — which hides the
   chart tooltip the moment you hover a bar the browser had to scroll into
   view. A tooltip that works except just after a scroll is a tooltip that
   works except when you use it. */
#thread{flex:1;overflow:auto;min-height:0;padding:20px 20px 4px}
#col{max-width:940px;margin:0 auto}
.turn{margin:0 0 4px}
.turn.you{text-align:right}
.turn.you .bubble{display:inline-block;background:var(--accent);color:#fff;
  padding:7px 13px;border-radius:3px;text-align:left;font-size:13.5px;max-width:70ch}
.who{font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.11em;
  text-transform:uppercase;color:var(--ink-faint);margin:0 0 5px;font-weight:600}
.block{margin:0 0 12px;max-width:80ch}
.block p{margin:0 0 8px}
.status{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink-faint);
  margin:0 0 10px}

/* ---------- a card in the column ---------- */
.box{border:1px solid var(--rule);border-radius:8px;background:var(--surface);
  margin:0 0 16px;overflow:hidden}
.box>.bh{display:flex;align-items:baseline;gap:10px;padding:11px 16px 10px;
  border-bottom:1px solid var(--rule-soft)}
.box>.bh h2{font-size:13.5px;font-weight:600;margin:0;letter-spacing:-.005em}
.box>.bh .n{font-family:"IBM Plex Mono",monospace;font-size:10px;font-weight:600;
  color:var(--accent);background:var(--accent-soft);border-radius:3px;padding:1px 6px;
  flex:none}
.box>.bh .sub{font-family:"IBM Plex Mono",monospace;font-size:10px;color:var(--ink-faint);
  letter-spacing:.04em;margin-left:auto;text-align:right;white-space:nowrap}
.box>.bb{padding:13px 16px 4px}
.box>.bb.flush{padding:0}
.box>.bf{display:flex;gap:8px;align-items:center;flex-wrap:wrap;
  padding:11px 16px;border-top:1px solid var(--rule-soft);background:var(--paper)}
.box.done{background:var(--paper)}
.box.done>.bh{border-bottom:0}
.box.done>.bh h2{font-weight:500;color:var(--ink-soft)}
.box .lead{font-size:12.5px;color:var(--ink-soft);line-height:1.55;max-width:74ch;
  margin:0 0 11px}
.box .lead b{color:var(--ink);font-weight:600}
.done-line{font-size:12.5px;color:var(--ink-soft);margin-left:auto;text-align:right;
  max-width:56ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tick-ok{color:var(--good);font-weight:600;margin-right:6px}

/* buttons */
.go,.alt,.mini{font:inherit;font-size:11.5px;cursor:pointer;border-radius:4px;
  padding:5px 12px;border:1px solid var(--rule);background:none;color:var(--ink-soft)}
.go{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:500}
.go:hover{filter:brightness(1.12)}
.alt:hover{border-color:var(--accent);color:var(--accent)}
.mini{font-size:10.5px;padding:3px 8px}
button:disabled{cursor:default;opacity:.55}
.spacer{flex:1}

/* ---------- pickers ---------- */
.phead{display:flex;align-items:center;gap:12px;margin-bottom:10px;flex-wrap:wrap}
.phead select.catsel{font:inherit;font-size:12px;background:var(--surface);
  color:var(--ink);border:1px solid var(--rule);border-radius:4px;padding:5px 8px}
.pcount{font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--dim)}
.scroll{max-height:min(46vh,420px);overflow:auto;border:1px solid var(--rule-soft);
  border-radius:5px}
table.pick{width:100%;border-collapse:collapse;font-size:12.5px}
table.pick th{text-align:left;font-family:"IBM Plex Mono",monospace;font-size:9.5px;
  letter-spacing:.06em;text-transform:uppercase;color:var(--dim);
  padding:7px 10px 6px 0;border-bottom:1px solid var(--rule);position:sticky;top:0;
  background:var(--surface);z-index:2}
table.pick th:first-child,table.pick td:first-child{padding-left:11px}
table.pick th.num,table.pick td.num{text-align:right}
table.pick td{padding:6px 10px 6px 0;border-bottom:1px solid var(--rule-soft);
  vertical-align:top}
table.pick td small{display:block;font-size:10px;color:var(--dim);
  font-family:"IBM Plex Mono",monospace}
table.pick input.qty{font:inherit;font-size:12px;width:96px;text-align:right;
  background:none;border:1px solid transparent;border-radius:4px;padding:2px 5px;
  color:var(--ink);font-family:"IBM Plex Mono",monospace}
table.pick input.qty:hover{border-color:var(--rule)}
table.pick input.qty:focus{border-color:var(--accent);background:var(--surface);outline:none}
table.pick input.qty.moved{color:var(--accent);font-weight:500}
table.pick tr.new td{background:var(--accent-soft)}
table.pick tbody tr{cursor:pointer}
table.pick tbody tr:hover{background:var(--surface-2)}
table.pick .mark{display:inline-block;width:12px;height:12px;border-radius:3px;
  border:1px solid var(--rule);margin-top:2px}
table.pick tr.on .mark{background:var(--accent);border-color:var(--accent);
  box-shadow:inset 0 0 0 2px var(--surface)}
.addrow{display:flex;gap:6px;margin-top:10px;align-items:center;flex-wrap:wrap}
.addrow input,.addrow select{font:inherit;font-size:12px;padding:5px 8px;
  border:1px solid var(--rule);border-radius:4px;background:var(--surface);color:var(--ink)}
.addrow input.d{flex:1;min-width:240px}
.addrow input.q{width:110px;text-align:right}

.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:9px}
.vcard{text-align:left;font:inherit;cursor:pointer;background:var(--surface);
  border:1px solid var(--rule);border-radius:6px;padding:11px 12px;color:var(--ink);
  display:flex;flex-direction:column;gap:3px;position:relative}
.vcard:hover{border-color:var(--ink-faint)}
.vcard.on{border-color:var(--accent);box-shadow:inset 2px 0 0 var(--accent)}
.vcard .mark{position:absolute;top:11px;right:11px;width:12px;height:12px;
  border-radius:3px;border:1px solid var(--rule)}
.vcard.on .mark{background:var(--accent);border-color:var(--accent);
  box-shadow:inset 0 0 0 2px var(--surface)}
.vcard b{font-weight:500;font-size:12.5px;padding-right:18px}
.vcard em{font-style:normal;font-size:11px;color:var(--dim)}

/* questionnaire */
.qrow{display:grid;grid-template-columns:16px 1fr auto;gap:11px;align-items:start;
  padding:8px 2px;border-bottom:1px solid var(--rule-soft);cursor:pointer}
.qrow:hover{background:var(--surface-2)}
.qrow .mark{width:12px;height:12px;border-radius:3px;border:1px solid var(--rule);
  margin-top:3px}
.qrow.on .mark{background:var(--accent);border-color:var(--accent);
  box-shadow:inset 0 0 0 2px var(--surface)}
.qrow .qt{font-size:12.5px;line-height:1.45}
.qrow .qt b{font-family:"IBM Plex Mono",monospace;font-size:11px;font-weight:600;
  color:var(--ink-faint);margin-right:6px}
.qrow .qt em{display:block;font-style:normal;font-size:11px;color:var(--dim);
  margin-top:2px}
.qrow.off{opacity:.45}
.qrow .gate{font:inherit;font-size:10px;letter-spacing:.05em;text-transform:uppercase;
  font-family:"IBM Plex Mono",monospace;cursor:pointer;border-radius:3px;padding:3px 7px;
  border:1px solid transparent;background:none;color:var(--ink-faint);white-space:nowrap}
/* Nine outlined buttons down the right-hand side read as nine things to do.
   The control is there for every row; it only draws itself on the row you are
   on, or on the rows where it is already switched on. */
.qrow:hover .gate,.qrow .gate:focus-visible{border-color:var(--rule)}
.qrow .gate.on{background:var(--risk-bg);border-color:var(--risk-line);color:var(--risk);
  font-weight:600}
.qrow.off .gate{visibility:hidden}
.terms{display:flex;gap:7px;flex-wrap:wrap;margin:4px 0 6px}
.terms button{font:inherit;font-size:12px;cursor:pointer;border-radius:4px;padding:5px 12px;
  border:1px solid var(--rule);background:none;color:var(--ink-soft);
  font-family:"IBM Plex Mono",monospace}
.terms button.on{border-color:var(--accent);background:var(--accent-soft);color:var(--ink);
  font-weight:600}
.consq{font-size:11.5px;color:var(--dim);line-height:1.5;margin:0 0 12px;max-width:70ch}
.fieldrow{display:flex;gap:10px;align-items:center;margin:0 0 12px;flex-wrap:wrap}
.fieldrow label{font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.07em;
  text-transform:uppercase;color:var(--dim)}
.fieldrow input{font:inherit;font-size:12.5px;padding:5px 9px;border:1px solid var(--rule);
  border-radius:4px;background:var(--surface);color:var(--ink)}
.sechead{font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--dim);margin:16px 0 7px;padding-top:12px;
  border-top:1px solid var(--rule-soft)}
.sechead:first-child{margin-top:0;padding-top:0;border-top:0}

/* ---------- the covering mail ---------- */
table.kvt{width:100%;border-collapse:collapse;font-size:12.5px}
table.kvt th{text-align:left;vertical-align:top;white-space:nowrap;width:120px;
  font-weight:400;color:var(--dim);padding:5px 14px 5px 0;
  border-bottom:1px solid var(--rule-soft)}
table.kvt td{padding:5px 0;border-bottom:1px solid var(--rule-soft)}
table.kvt input.subj{width:100%;font:inherit;font-size:12.5px;padding:4px 7px;
  border:1px solid transparent;border-radius:4px;background:none;color:var(--ink)}
table.kvt input.subj:hover{border-color:var(--rule)}
table.kvt input.subj:focus{border-color:var(--accent);background:var(--paper);outline:none}
textarea.mailbody{width:100%;min-height:340px;font-family:"Public Sans",system-ui,sans-serif;
  font-size:12.5px;line-height:1.6;margin:12px 0 4px;padding:12px 14px;
  background:var(--paper);color:var(--ink);border:1px solid var(--rule);border-radius:5px;
  resize:vertical}
textarea.mailbody:focus{outline:2px solid var(--accent);outline-offset:-2px}
.mailbody-ro{white-space:pre-wrap;font-size:12.5px;line-height:1.6;margin:12px 0 4px;
  padding:12px 14px;background:var(--paper);border:1px solid var(--rule-soft);
  border-radius:5px;max-height:320px;overflow:auto}
.attach{font-size:11px;color:var(--dim);margin:8px 0 0}
.stub{font-size:11px;color:var(--dim);font-style:italic;margin:10px 0 0;
  max-width:74ch;line-height:1.5}
.edited{font-size:11px;color:var(--accent);font-family:"IBM Plex Mono",monospace}

/* ---------- the round ---------- */
table.round{width:100%;border-collapse:collapse;font-size:12.5px}
table.round td{padding:7px 10px 7px 0;border-bottom:1px solid var(--rule-soft);
  vertical-align:top}
table.round td.v{font-weight:500;width:220px}
table.round td.s{width:145px;font-family:"IBM Plex Mono",monospace;font-size:10.5px;
  letter-spacing:.04em;text-transform:uppercase;color:var(--ink-faint)}
table.round tr.done td.s{color:var(--ok)}
table.round tr.wait td.s{color:var(--warn)}
table.round td.n{font-size:11.5px;color:var(--dim)}

/* ---------- the comparison grid, in the conversation ---------- */
.legend{display:flex;gap:12px;font-size:10.5px;color:var(--ink-soft);align-items:center;
  flex-wrap:wrap;margin:0 0 9px}
.legend i{width:11px;height:11px;display:inline-block;border:1px solid var(--rule);
  margin-right:5px;vertical-align:-1px}
.legend .d{background:var(--derived-bg);border-color:var(--derived-line)}
.legend .u{background:var(--risk-bg);border-color:var(--risk-line)}
.legend .b{background:var(--accent);border:0;width:2px;height:12px}
.legend .r{background:var(--rank);border:0;width:14px;height:2px;opacity:.75}
.legend .sep{width:1px;height:12px;background:var(--rule)}
.gridwrap{max-height:min(62vh,560px);overflow:auto;border-top:1px solid var(--rule-soft)}
table.cmp{border-collapse:separate;border-spacing:0;width:100%;font-size:12.5px}
table.cmp thead th{position:sticky;top:0;z-index:2;background:var(--surface-2);
  font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.06em;
  text-transform:uppercase;color:var(--ink-soft);font-weight:600;text-align:left;
  padding:7px 10px;border-bottom:1px solid var(--rule);white-space:nowrap}
table.cmp thead th.num{text-align:right}
table.cmp tbody td{padding:5px 10px;border-bottom:1px solid var(--rule-soft);
  vertical-align:top}
table.cmp tbody td.num{text-align:right;font-family:"IBM Plex Mono",monospace;
  font-variant-numeric:tabular-nums;white-space:nowrap;cursor:pointer;position:relative}
table.cmp tbody td.num:hover{outline:1.5px solid var(--accent);outline-offset:-1.5px}
table.cmp td.num small{display:block;font-size:9.5px;color:var(--ink-faint);
  font-family:"IBM Plex Mono",monospace;letter-spacing:.02em;margin-top:1px}
td.s-derived{background:var(--derived-bg);box-shadow:inset 2px 0 0 var(--derived-line)}
td.s-unresolved{background:var(--risk-bg);box-shadow:inset 2px 0 0 var(--risk-line);
  color:var(--risk);font-weight:600}
td.s-extracted{background:transparent}
table.cmp tbody td.num i.rank{position:absolute;left:6px;bottom:3px;height:2px;
  border-radius:1px;background:var(--rank);opacity:.75;max-width:calc(100% - 12px);
  pointer-events:none}
table.cmp tbody td.best{font-weight:500}
table.cmp tbody td.best::before{content:"";position:absolute;left:0;top:4px;bottom:4px;
  width:2px;background:var(--accent);border-radius:1px}
td.item{max-width:330px;font-size:12px;line-height:1.35}
td.item small{display:block;color:var(--ink-faint);font-family:"IBM Plex Mono",monospace;
  font-size:9.5px;letter-spacing:.03em}
.foots{padding:8px 16px;font-size:11px;color:var(--ink-soft);
  border-top:1px solid var(--rule-soft)}
/* The grid bleeds to the card edge; the prose above it keeps its gutter. */
.box>.bb>.gridwrap{margin:10px -16px 0}
.box>.bb>.foots{margin:0 -16px}
.choice .opts{display:flex;flex-direction:column;gap:1px}

/* ---------- options, memo, suggestions ---------- */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(228px,1fr));gap:12px;
  margin-bottom:12px}
.ocard{border:1px solid var(--rule);border-radius:7px;padding:15px 16px 16px;
  background:var(--surface);position:relative;display:flex;flex-direction:column;gap:7px}
.ocard:first-child::before{content:"";position:absolute;left:-1px;right:-1px;top:-1px;
  height:2px;background:var(--accent);border-radius:7px 7px 0 0}
.ocard.bad{border-color:var(--risk-line);background:var(--risk-bg)}
.ocard.off{opacity:.62;border-style:dashed}
.ocard .lbl{font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.09em;
  text-transform:uppercase;color:var(--dim);margin:0}
.ocard .cost{font-family:Newsreader,Georgia,serif;font-size:1.62rem;line-height:1;margin:0;
  font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.ocard .cost.na{font-size:1rem;color:var(--dim);font-family:"IBM Plex Mono",monospace}
.ocard .delta{font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--dim);
  vertical-align:middle;margin-left:3px}
.ocard .facts{display:flex;flex-wrap:wrap;gap:4px 12px;font-family:"IBM Plex Mono",monospace;
  font-size:10px;color:var(--dim);margin:0;padding-bottom:8px;
  border-bottom:1px solid var(--rule-soft)}
.ocard .who2{font-size:11.5px;margin:0;line-height:1.45}
.ocard .why{font-size:11.5px;color:var(--dim);line-height:1.5;margin:0}
.ocard .viol{margin:0;padding-left:15px;font-size:11px;color:var(--risk)}
.ocard .pick{margin-top:auto;font:inherit;font-size:11px;cursor:pointer;border-radius:4px;
  padding:5px 10px;border:1px solid var(--rule);background:none;color:var(--ink-soft)}
.ocard .pick:hover{border-color:var(--accent);color:var(--accent)}
.sug{display:flex;gap:11px;padding:10px 0;border-bottom:1px solid var(--rule-soft);
  align-items:baseline}
.sug:last-child{border-bottom:0}
.sug .i{font-family:"IBM Plex Mono",monospace;font-size:10px;color:var(--ink-faint);
  flex:none;padding-top:2px}
.sug b{font-weight:600;font-size:12.5px;display:block;margin-bottom:2px}
.sug span{font-size:11.5px;color:var(--ink-soft);line-height:1.5}
.md{font-size:13px;line-height:1.6}
.md h3{font-family:Newsreader,Georgia,serif;font-weight:500;font-size:1.15rem;margin:.2em 0 .5em}
.md h4{font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--dim);margin:1.4em 0 .5em}
.md h5{font-size:12.5px;margin:1em 0 .3em}
.md ul{padding-left:18px;margin:.4em 0}
.md hr{border:0;border-top:1px solid var(--rule);margin:1.2em 0}

/* ---------- gaps and follow-up ---------- */
.gap{border:1px solid var(--rule);border-left:2px solid var(--derived);border-radius:6px;
  padding:11px 13px;margin:0 0 9px;background:var(--surface)}
.gap.sent{border-left-color:var(--ok);opacity:.85}
.gap .top{display:flex;align-items:baseline;gap:9px;margin-bottom:4px;flex-wrap:wrap}
.gap .top b{font-weight:600;font-size:12.5px}
.gap .at{font-family:"IBM Plex Mono",monospace;font-size:10px;color:var(--dim);
  margin-left:auto}
.gap ul{margin:5px 0 0;padding-left:16px;font-size:12px;color:var(--ink-soft)}
.gap li{margin-bottom:3px}
.gap li em{font-style:normal;color:var(--ink-faint);font-size:11px;display:block}
.gap .rfoot{display:flex;gap:8px;margin-top:10px;align-items:center;flex-wrap:wrap}
.moved{display:flex;gap:18px;flex-wrap:wrap;margin:8px 0 0}
.moved div{font-size:12px}
.moved b{display:block;font-family:"IBM Plex Mono",monospace;font-size:15px;font-weight:600}
.moved .up{color:var(--good)} .moved .dn{color:var(--good)}

/* ---------- review queue ---------- */
.rgroup{border:1px solid var(--rule);border-left:2px solid var(--derived);border-radius:6px;
  padding:12px 13px 10px;margin:0 0 9px;background:var(--surface)}
.rgroup.done{opacity:.5;border-left-color:var(--ok)}
.rgroup .top{display:flex;align-items:baseline;gap:9px;margin-bottom:5px}
.rgroup .top b{font-weight:500;font-size:13px;flex:1}
.rgroup .n,.rgroup .conf{font-family:"IBM Plex Mono",monospace;font-size:10px;color:var(--dim);
  white-space:nowrap}
.rgroup .why{font-size:12px;line-height:1.5;color:var(--ink-soft);max-width:62ch}
.rgroup .who2{font-family:"IBM Plex Mono",monospace;font-size:10px;color:var(--ink-faint);
  margin-top:5px}
.rfoot{display:flex;gap:8px;margin-top:10px;align-items:center;flex-wrap:wrap}
.rcells{margin-top:9px;padding-top:9px;border-top:1px solid var(--rule-soft)}
.cell{border:1px solid var(--rule);background:var(--paper);padding:10px 12px;margin:0 0 8px;
  border-radius:5px}
.cell .top{display:flex;gap:10px;align-items:baseline;margin-bottom:4px}
.cell .conf{font-family:"IBM Plex Mono",monospace;font-size:10.5px;font-weight:600;
  color:var(--risk);background:var(--risk-bg);padding:2px 6px;border-radius:2px}
.cell .why{font-size:12px;color:var(--ink-soft);margin:4px 0 8px}
.cell button{font-size:11px;padding:4px 10px;margin-right:6px;border:1px solid var(--rule);
  background:var(--surface);color:var(--ink-soft);cursor:pointer;border-radius:4px}
.cell button:hover{border-color:var(--accent);color:var(--accent)}
.fixrow{display:flex;gap:6px;margin-top:8px;align-items:center}
.fixrow input{font:inherit;font-size:12px;flex:1;min-width:0;padding:5px 8px;
  border:1px solid var(--accent);border-radius:4px;background:var(--surface);color:var(--ink)}

/* ---------- charts ---------- */
.fig{margin:0 0 22px}
.fig h3{font-size:13px;font-weight:500;margin:0 0 2px}
.fig .sub{font-size:11.5px;color:var(--dim);margin:0 0 11px;line-height:1.5;max-width:70ch}
.fig svg{display:block;width:100%;height:auto;overflow:visible}
.fig .bar{fill:var(--accent)}
.fig .bar.tail{fill:var(--rule)}
.fig .bar:hover{fill:var(--rank)}
.fig .lbl{font-family:"IBM Plex Mono",monospace;font-size:9px;fill:var(--ink-faint)}
.fig .val{font-family:"IBM Plex Mono",monospace;font-size:9.5px;fill:var(--ink-soft)}
.fig .foot{display:flex;gap:8px;margin-top:8px;align-items:center;flex-wrap:wrap}
.fig .key{font-size:11px;color:var(--dim);display:flex;gap:14px;align-items:center}
.fig .key i{width:10px;height:10px;display:inline-block;margin-right:5px;vertical-align:-1px}
.fig .key .a{background:var(--accent)} .fig .key .t{background:var(--rule)}
table.sheet{width:100%;border-collapse:collapse;font-size:12px;margin-top:10px}
table.sheet th{text-align:left;font-family:"IBM Plex Mono",monospace;font-size:9.5px;
  letter-spacing:.06em;text-transform:uppercase;color:var(--dim);padding:0 10px 5px 0;
  border-bottom:1px solid var(--rule)}
table.sheet td{padding:5px 10px 5px 0;border-bottom:1px solid var(--rule-soft)}
table.sheet td.num,table.sheet th.num{text-align:right;
  font-family:"IBM Plex Mono",monospace;font-size:11px}
#tip{position:fixed;pointer-events:none;z-index:60;background:var(--ink);color:var(--paper);
  font-size:11.5px;line-height:1.45;padding:7px 9px;border-radius:5px;max-width:280px;
  box-shadow:0 6px 20px rgba(0,0,0,.25)}
#tip[hidden]{display:none}
#tip b{font-weight:600}
#tip .m{font-family:"IBM Plex Mono",monospace;font-size:10.5px;opacity:.85;display:block;
  margin-top:2px}

/* ---------- chat blocks ---------- */
details.qry{border-left:2px solid var(--rule);padding-left:10px;margin:6px 0 12px}
details.qry summary{cursor:pointer;font-family:"IBM Plex Mono",monospace;font-size:10.5px;
  color:var(--ink-faint);letter-spacing:.05em}
details.qry pre{font-family:"IBM Plex Mono",monospace;font-size:11px;white-space:pre-wrap;
  background:var(--surface);padding:9px 11px;margin:6px 0 0;overflow-x:auto;
  border:1px solid var(--rule-soft)}
.refusal{border-left:3px solid var(--derived);background:var(--surface);padding:12px 15px;
  border-radius:0 5px 5px 0;margin:0 0 12px;max-width:80ch}
.refusal .h{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.11em;
  text-transform:uppercase;color:var(--derived);font-weight:600;margin-bottom:5px}
.refusal ul{margin:7px 0 0;padding-left:18px;font-size:12.5px;color:var(--ink-soft)}
.choice{border:1px solid var(--rule);border-radius:6px;padding:13px 14px 11px;
  background:var(--surface);margin:0 0 12px;max-width:80ch}
.choice.done{opacity:.55}
.choice .h{font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--dim);margin-bottom:9px}
.choice .opt{display:flex;align-items:flex-start;gap:9px;width:100%;text-align:left;
  background:none;border:0;border-radius:4px;padding:7px 9px;cursor:pointer;color:var(--ink);
  font:inherit;font-size:12.5px;line-height:1.4}
.choice .opt:hover{background:var(--surface-2)}
.choice .opt .mark{flex:none;width:12px;height:12px;margin-top:3px;border:1px solid var(--rule);
  border-radius:3px}
.choice .opt.on .mark{background:var(--accent);border-color:var(--accent);
  box-shadow:inset 0 0 0 2px var(--surface)}
.choice .opt em{display:block;font-style:normal;font-size:11px;color:var(--dim);margin-top:1px}
.choice .cnote{font-family:"IBM Plex Mono",monospace;font-size:10px;color:var(--ink-faint);
  margin-top:9px;line-height:1.5}
.choice .foot{display:flex;gap:8px;margin-top:10px;padding-top:9px;
  border-top:1px solid var(--rule-soft)}
.asm{width:100%;font-size:12px;border-collapse:collapse}
.asm td{padding:4px 8px 4px 0;border-bottom:1px solid var(--rule-soft)}
.derivation{background:var(--paper);border:1px solid var(--rule-soft);padding:10px 12px;
  font-size:12px;margin:0 0 12px;border-radius:5px}
.derivation h4{margin:0 0 6px;font-family:"IBM Plex Mono",monospace;font-size:10px;
  letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint)}
.derivation li{margin-bottom:5px;color:var(--ink-soft)}
table.prov{width:100%;border-collapse:collapse;margin-top:10px;font-size:11px}
table.prov th{text-align:left;font-family:"IBM Plex Mono",monospace;font-size:9.5px;
  letter-spacing:.06em;text-transform:uppercase;color:var(--dim);padding:4px 10px 4px 0;
  border-bottom:1px solid var(--rule)}
table.prov td{padding:4px 10px 4px 0;border-bottom:1px solid var(--rule)}

/* ---------- composer ---------- */
#composer{flex:none;border-top:1px solid var(--rule);background:var(--surface);
  padding:11px 20px}
#composer .in{max-width:940px;margin:0 auto}
#composer form{display:flex;gap:9px}
#q{flex:1;font-family:inherit;font-size:14px;padding:9px 12px;background:var(--paper);
  color:var(--ink);border:1px solid var(--rule);border-radius:3px}
#q:focus{outline:2px solid var(--accent);outline-offset:-1px}
#composer form button{padding:9px 18px;background:var(--accent);color:#fff;border:0;
  border-radius:3px;font-size:13.5px;font-weight:500;cursor:pointer}
.suggest{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}
.suggest button{background:transparent;border:1px solid var(--rule);color:var(--ink-soft);
  font-size:11.5px;padding:4px 9px;border-radius:2px;cursor:pointer;font-weight:400}
.suggest button:hover{border-color:var(--accent);color:var(--accent)}

/* ---------- evidence drawer ---------- */
#drawer{position:fixed;top:0;right:0;height:100%;width:min(520px,92vw);
  background:var(--surface);border-left:1px solid var(--rule);z-index:40;
  transform:translateX(101%);transition:transform .22s ease;display:flex;
  flex-direction:column;box-shadow:-8px 0 28px rgba(0,0,0,.10)}
#drawer.open{transform:none}
#drawer .dh{padding:13px 16px;border-bottom:1px solid var(--rule);display:flex;
  align-items:baseline;gap:10px;flex:none}
#drawer .dh h3{margin:0;font-size:.9rem;font-weight:600}
#drawer .dh button{margin-left:auto;background:none;border:0;color:var(--ink-faint);
  font-size:19px;cursor:pointer;line-height:1}
#drawer .db{overflow:auto;padding:14px 16px;flex:1}
#drawer img{width:100%;border:1px solid var(--rule)}
#drawer iframe{width:100%;height:420px;border:1px solid var(--rule);background:#fff}
.kv{font-size:12px;margin:0 0 12px}
.kv div{display:flex;gap:10px;padding:3px 0;border-bottom:1px solid var(--rule-soft)}
.kv span:first-child{color:var(--ink-faint);min-width:118px;
  font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.04em;
  text-transform:uppercase;padding-top:2px}
.kv b{font-weight:600}
.src details.sheet{margin-bottom:12px}
.src details.sheet summary{font-family:"IBM Plex Mono",monospace;font-size:10px;
  letter-spacing:.06em;text-transform:uppercase;color:var(--dim);cursor:pointer;padding:5px 0}
table.grid{border-collapse:collapse;font-family:"IBM Plex Mono",monospace;font-size:10.5px;
  width:100%;table-layout:fixed}
table.grid td{border:1px solid var(--rule);padding:3px 5px;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap;max-width:110px}
table.grid td.hid{opacity:.45;font-style:italic}
table.grid td.hit{background:var(--accent-soft);outline:1.5px solid var(--accent);
  outline-offset:-1.5px}
table.grid tr.hit td{background:var(--accent-soft)}
.src h5{font-size:12px;margin:1em 0 .3em}
.src p{font-size:12px;line-height:1.55;margin:.4em 0}
#scrim{position:fixed;inset:0;background:rgba(10,12,14,.30);z-index:39;display:none}
#scrim.on{display:block}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:680px){
  .box>.bh .sub{display:none}
  td.item{max-width:200px}
}
</style>

<body>

<header>
  <h1>Kill the Quote Spreadsheet</h1>
  <div class="meta" id="meta"></div>
  <div class="spacer"></div>
  <button class="chip risk" id="chipReview" hidden></button>
  <button class="chip warn" id="chipAsm" hidden>assumptions</button>
  <button class="chip plain" id="chipReset">start over</button>
</header>

<main id="thread"><div id="col"></div></main>

<div id="composer">
  <div class="in">
    <form id="f">
      <input id="q" autocomplete="off" placeholder="Tell me what you need to buy…">
      <button type="submit">Ask</button>
    </form>
    <div class="suggest" id="suggest"></div>
  </div>
</div>

<div id="tip" hidden></div>
<div id="scrim"></div>
<aside id="drawer" aria-hidden="true">
  <div class="dh"><h3 id="dTitle">Evidence</h3><button id="dClose" aria-label="Close">×</button></div>
  <div class="db" id="dBody"></div>
</aside>

<script>
/* ===========================================================================
   Helpers
   ======================================================================== */
const $ = s => document.querySelector(s);
const el = (t, c, h) => { const e = document.createElement(t); if (c) e.className = c;
  if (h !== undefined) e.innerHTML = h; return e; };
const esc = s => String(s ?? '').replace(/[&<>"]/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const inr  = n => '₹' + Number(n).toLocaleString('en-IN', {maximumFractionDigits:2});
const inr0 = n => '₹' + Math.round(n).toLocaleString('en-IN');
const num  = n => Number(n).toLocaleString('en-IN');
const plural = (n, w) => n + ' ' + w + (n === 1 ? '' : 's');
const fortnight = () => new Date(Date.now() + 14 * 864e5).toISOString().slice(0, 10);
const jget = async u => { const r = await fetch(u);
  if (!r.ok) throw new Error((await r.text()).slice(0, 180)); return r.json(); };

let CAT = null, DRAFT = null, STATE = null, ROUND = null, SPENDDATA = null;
let PHASE = 'draft', ITEMCAT = 'corrugated';
const S = {};                       // the cards, by name — one of each, ever

/* ---------------- the column ---------------- */
const col = () => $('#col');
function atEnd(node){ col().appendChild(node); scrollEnd(); return node; }
function scrollEnd(){ requestAnimationFrame(() => { $('#thread').scrollTop = 1e9; }); }

function turn(who, cls){
  const d = el('div', 'turn ' + (cls || ''));
  if (who) d.appendChild(el('div', 'who', esc(who)));
  return atEnd(d);
}
function say(who, html){
  const t = turn(who);
  t.appendChild(el('div', 'block', html));
  return t;
}

/* A card. Header, body, footer; it can collapse to one line and come back. */
function box(o){
  const b = el('section', 'box');
  if (o.key) b.dataset.card = o.key;   // a stable hook for the smoke test
  const bh = el('div', 'bh');
  if (o.n) bh.appendChild(el('span', 'n', esc(o.n)));
  bh.appendChild(el('h2', '', esc(o.title)));
  const sub = el('span', 'sub');
  bh.appendChild(sub);
  const bb = el('div', 'bb' + (o.flush ? ' flush' : ''));
  const bf = el('div', 'bf'); bf.hidden = true;
  b.append(bh, bb, bf);
  b.head = bh; b.body = bb; b.foot = bf;
  b.setSub = t => { sub.textContent = t || ''; };
  return b;
}
function collapse(b, text, onEdit){
  // The summary is a function of the draft, not a string frozen when the step
  // was closed. The co-pilot can change a closed step from the box at the
  // bottom, and a card still claiming "30 lines" after it was cut to twelve is
  // worse than no summary at all.
  b._sum = typeof text === 'function' ? text : () => text;
  b.classList.add('done');
  b.body.hidden = true; b.foot.hidden = true;
  b.setSub('');
  b.head.querySelectorAll('.done-line,.reopen').forEach(x => x.remove());
  b.head.appendChild(el('span', 'done-line',
    '<span class="tick-ok">✓</span>' + esc(b._sum())));
  if (onEdit !== null){
    const edit = el('button', 'mini reopen', 'Change');
    edit.onclick = () => { expand(b); if (onEdit) onEdit(); };
    b.head.appendChild(edit);
  }
  return b;
}
function resummarise(b){
  if (!b || !b._sum || !b.classList.contains('done')) return;
  const line = b.head.querySelector('.done-line');
  if (line) line.innerHTML = '<span class="tick-ok">\u2713</span>' + esc(b._sum());
}
function expand(b){
  b.classList.remove('done');
  b.body.hidden = false; b.foot.hidden = false;
  b.head.querySelectorAll('.done-line,.reopen').forEach(x => x.remove());
  b.scrollIntoView({block:'nearest'});
  return b;
}
function actions(b, list){
  b.foot.replaceChildren();
  b.foot.hidden = !list.length;
  list.forEach(([label, cls, fn, disabled]) => {
    const x = el('button', cls, esc(label));
    if (disabled) x.disabled = true;
    x.onclick = fn;
    b.foot.appendChild(x);
  });
  return b.foot;
}

/* ===========================================================================
   Boot
   ======================================================================== */
async function boot(){
  $('#chipAsm').onclick = showAssumptions;
  $('#chipReset').onclick = resetAll;
  $('#dClose').onclick = closeDrawer; $('#scrim').onclick = closeDrawer;
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDrawer(); });
  $('#f').onsubmit = e => { e.preventDefault();
    const v = $('#q').value.trim(); if (v) ask(v); };

  let d;
  [d, CAT] = await Promise.all([jget('/api/draft'), jget('/api/catalogue')]);
  DRAFT = d.draft; DRAFT.missing = d.missing; PHASE = d.phase;
  try { ROUND = await jget('/api/round'); } catch (e){ ROUND = null; }

  if (PHASE === 'comparison'){ await enterResults({restored: true}); }
  else { openAuthoring(); }
}

async function resetAll(){
  await fetch('/api/reset', {method:'POST'});
  location.reload();
}

/* The draft is read back from the server, never tracked here. Two copies of the
   RFx — one in the browser, one in the session — is exactly how a picker and a
   co-pilot end up disagreeing about what is going out to five companies. */
async function patchDraft(patch){
  const r = await fetch('/api/draft', {method:'POST',
    headers:{'Content-Type':'application/json'}, body: JSON.stringify(patch)});
  const j = await r.json();
  DRAFT = j.draft; DRAFT.missing = j.missing;
  headerMeta();
  return DRAFT;
}
async function reloadDraft(){
  const j = await jget('/api/draft');
  DRAFT = j.draft; DRAFT.missing = j.missing; PHASE = j.phase;
  headerMeta();
  return DRAFT;
}

function headerMeta(){
  const m = $('#meta');
  if (PHASE === 'draft'){
    const l = (DRAFT.line_nos || []).length, v = (DRAFT.vendor_ids || []).length;
    m.innerHTML = `<span>Drafting</span>` +
      (l ? `<span>${l} line${l === 1 ? '' : 's'}</span>` : '') +
      (v ? `<span>${v} vendor${v === 1 ? '' : 's'}</span>` : '');
  } else if (STATE && STATE.rfx){
    m.innerHTML = `<span>${esc(STATE.rfx.rfx_id)}</span>
      <span>${esc(STATE.rfx.required_payment_terms || '')}</span>
      <span>${STATE.counts.unresolved} unresolved</span>`;
  }
}

function suggest(list){
  const s = $('#suggest'); s.replaceChildren();
  (list || []).forEach(x => {
    const b = el('button', '', esc(x.length > 46 ? x.slice(0, 44) + '…' : x));
    b.title = x; b.onclick = () => ask(x); s.appendChild(b);
  });
}

/* ===========================================================================
   AUTHORING — four steps, in the order a buyer takes them
   ---------------------------------------------------------------------------
   Items, then vendors, then questions, then the mail. Each one is a card you
   can change, and nothing is sent until you have read the actual text going
   out. The co-pilot is still there in the box at the bottom — it can do any of
   these in a sentence — but the steps do not depend on it, and a click writes
   straight to the draft with no model call.
   ======================================================================== */
function openAuthoring(){
  headerMeta();
  $('#q').placeholder = 'Tell me what you need to buy…';
  say('Co-pilot', `<p>Let's put a tender together. Four steps: <b>what you're
    buying</b>, <b>who you're asking</b>, <b>what you want to know about them</b>,
    then the covering mail — which you read in full and send yourself.</p>
    <p>Change anything at any point. You can also just tell me in a sentence and
    I'll fill it in.</p>`);
  suggest(['Annual corrugated packaging, back in two weeks',
           'Same as last year, but 30-day terms',
           'What should I gate on?',
           'Only the 3-ply boxes this quarter']);
  stepItems();
}

/* ---------------- 1 · line items ---------------- */
function stepItems(){
  if (S.items){ expand(S.items); drawItems(); return; }
  const b = S.items = box({n:'1', title:'What are you buying?', key:'items'});
  atEnd(b);
  // The item master is what the buyer HAS bought. Starting with all of it
  // ticked is the honest default for an annual tender — the work is taking
  // things OUT, not putting thirty back in one at a time.
  if (!(DRAFT.line_nos || []).length && CAT.lines.length){
    patchDraft({line_nos: CAT.lines.map(l => l.line_no)}).then(drawItems);
  }
  drawItems();
}

function drawItems(){
  const b = S.items; if (!b) return;
  const cats = CAT.categories || [];
  const cat = cats.find(c => c.key === ITEMCAT) || cats[0] || {key:'corrugated'};
  ITEMCAT = cat.key;
  const lines = CAT.lines.filter(l => (l.category || 'corrugated') === cat.key);
  const chosen = new Set(DRAFT.line_nos || []);
  const extra = DRAFT.extra_lines || [];
  const inCat = lines.filter(l => chosen.has(l.line_no)).length;
  const mine = chosen.size;

  b.body.replaceChildren();
  b.body.appendChild(el('div', 'lead',
    `Your item master, as it stands. Untick anything you are not buying this
     year, change a quantity where the volume has moved — <b>it decides whether
     a line clears a vendor's minimum order</b> — and add anything new.`));

  const head = el('div', 'phead');
  const sel = el('select', 'catsel');
  cats.forEach(c => {
    const o = document.createElement('option');
    o.value = c.key;
    o.textContent = c.name + (c.lines ? ` (${c.lines})` : ' — empty');
    if (c.key === ITEMCAT) o.selected = true;
    sel.appendChild(o);
  });
  sel.onchange = () => { ITEMCAT = sel.value; drawItems(); };
  head.appendChild(sel);
  head.appendChild(el('span', 'pcount',
    lines.length ? `${inCat} of ${lines.length} selected`
      + (extra.length ? ` · ${plural(extra.length, 'line')} added` : '') : ''));
  b.body.appendChild(head);

  if (!lines.length){
    b.body.appendChild(el('div', 'status', esc(cat.note || 'No data available.')));
  } else {
    const wrap = el('div', 'scroll');
    const t = el('table', 'pick');
    t.innerHTML = `<thead><tr><th style="width:18px"></th><th style="width:34px">#</th>
      <th>Item</th><th class="num">Annual qty</th><th>Unit</th></tr></thead>`;
    const tb = document.createElement('tbody');

    lines.forEach(l => {
      const tr = document.createElement('tr');
      if (chosen.has(l.line_no)) tr.className = 'on';
      const tags = [l.ply ? l.ply + '-ply' : null,
                    l.food_contact ? 'food contact' : null,
                    l.requires_tooling ? 'tooling' : null].filter(Boolean).join(' · ');
      const over = (DRAFT.qty_overrides || {});
      const qty = over[l.line_no] != null ? over[l.line_no] : l.annual_qty;
      const moved = qty !== l.annual_qty;
      tr.innerHTML = `<td><span class="mark"></span></td>
        <td>${l.line_no}</td>
        <td>${esc(l.description)}<small>${esc(l.code)}${tags ? ' · ' + esc(tags) : ''}</small></td>
        <td class="num"><input class="qty${moved ? ' moved' : ''}" inputmode="numeric"
            value="${num(qty)}" aria-label="Annual quantity for line ${l.line_no}">${
            moved ? `<small>was ${num(l.annual_qty)}</small>` : ''}</td>
        <td>${esc(l.uom)}</td>`;
      const input = tr.querySelector('input.qty');
      input.onclick = e => e.stopPropagation();
      const save = async () => {
        const n = parseInt(String(input.value).replace(/[^0-9]/g, ''), 10);
        if (!n || n === qty){ drawItems(); return; }
        const o = {...(DRAFT.qty_overrides || {})};
        if (n === l.annual_qty) delete o[l.line_no]; else o[l.line_no] = n;
        const next = new Set(DRAFT.line_nos || []);
        next.add(l.line_no);                  // editing a quantity schedules it
        await patchDraft({qty_overrides: o, line_nos: [...next].sort((a, b) => a - b)});
        drawItems(); staleMail();
      };
      input.onblur = save;
      input.onkeydown = e => { if (e.key === 'Enter') input.blur();
                               if (e.key === 'Escape') drawItems(); };
      tr.onclick = async () => {
        const next = new Set(DRAFT.line_nos || []);
        next.has(l.line_no) ? next.delete(l.line_no) : next.add(l.line_no);
        tr.classList.toggle('on');                      // optimistic; feels instant
        await patchDraft({line_nos: [...next].sort((a, b) => a - b)});
        drawItems(); staleMail();
      };
      tb.appendChild(tr);
    });

    // Lines the buyer added this year. No history and no quotes — which is the
    // honest result: they come back as gaps, and the screen already knows how
    // to say "not a zero, not a no-quote".
    extra.forEach(x => {
      const tr = document.createElement('tr');
      tr.className = 'on new';
      tr.innerHTML = `<td><span class="mark"></span></td>
        <td>${x.line_no}</td>
        <td>${esc(x.description)}<small>added this year · no price history</small></td>
        <td class="num">${num(x.annual_qty)}</td>
        <td>${esc(x.uom || 'piece')}</td>`;
      tr.onclick = async () => {
        await patchDraft({extra_lines: extra.filter(y => y.line_no !== x.line_no),
                          line_nos: (DRAFT.line_nos || []).filter(n => n !== x.line_no)});
        drawItems(); staleMail();
      };
      tb.appendChild(tr);
    });
    t.appendChild(tb); wrap.appendChild(t); b.body.appendChild(wrap);
  }

  b.setSub(mine ? `${mine} scheduled` : 'nothing scheduled');
  actions(b, [
    [`Continue with ${plural(mine, 'line')}`, 'go', () => {
      collapse(b, () => `${plural((DRAFT.line_nos || []).length, 'line')} scheduled`,
        drawItems);
      stepVendors();
    }, !mine],
    ['Select all ' + lines.length, 'alt', async () => {
      const keep = (DRAFT.line_nos || []).filter(n => !lines.some(l => l.line_no === n));
      await patchDraft({line_nos: [...new Set([...keep, ...lines.map(l => l.line_no)])]
        .sort((a, b) => a - b)});
      drawItems(); staleMail();
    }],
    ['Clear', 'alt', async () => {
      await patchDraft({line_nos: (DRAFT.line_nos || [])
        .filter(n => !lines.some(l => l.line_no === n))});
      drawItems(); staleMail();
    }],
    ['Add a line', 'alt', () => addLineForm(b)],
  ]);
}

function addLineForm(b){
  if (b.body.querySelector('.addrow')) return;
  const extra = DRAFT.extra_lines || [];
  const row = el('div', 'addrow');
  row.innerHTML = `<input class="d" placeholder="Description, e.g. Shelf-ready tray, 3-ply, 400x300 mm">
    <input class="q" inputmode="numeric" placeholder="Annual qty">
    <select class="u"><option value="piece">piece</option><option value="kg">kg</option>
    <option value="set">set</option><option value="100_pieces">100 pieces</option></select>`;
  const ok = el('button', 'go', 'Add'), no = el('button', 'alt', 'Cancel');
  ok.onclick = async () => {
    const desc = row.querySelector('.d').value.trim();
    const q = parseInt(String(row.querySelector('.q').value).replace(/[^0-9]/g, ''), 10);
    if (!desc || !q){ row.querySelector('.d').focus(); return; }
    const used = new Set([...CAT.lines.map(l => l.line_no), ...extra.map(x => x.line_no)]);
    let n = 91; while (used.has(n)) n++;
    await patchDraft({
      extra_lines: [...extra, {line_no:n, description:desc, annual_qty:q,
        uom: row.querySelector('.u').value, style:'sheet', code:'NEW-' + n}],
      line_nos: [...new Set([...(DRAFT.line_nos || []), n])]});
    drawItems(); staleMail();
  };
  no.onclick = () => row.remove();
  row.append(ok, no);
  b.body.appendChild(row);
  row.querySelector('.d').focus();
}

/* ---------------- 2 · vendors ---------------- */
function stepVendors(){
  if (S.vendors){ expand(S.vendors); drawVendors(); return; }
  const b = S.vendors = box({n:'2', title:'Who are you asking?', key:'vendors'});
  atEnd(b);
  if (!(DRAFT.vendor_ids || []).length && CAT.vendors.length){
    patchDraft({vendor_ids: CAT.vendors.map(v => v.vendor_id)}).then(drawVendors);
  }
  drawVendors();
}

function drawVendors(){
  const b = S.vendors; if (!b) return;
  const vs = CAT.vendors || [];
  const chosen = new Set(DRAFT.vendor_ids || []);
  b.body.replaceChildren();
  b.body.appendChild(el('div', 'lead',
    `Your approved vendor list. Whoever is here can win, and nobody else can —
     so this and the schedule are the two things you cannot fix after the quotes
     land.`));
  const grid = el('div', 'vgrid');
  vs.forEach(v => {
    const c = el('button', 'vcard' + (chosen.has(v.vendor_id) ? ' on' : ''));
    c.innerHTML = `<span class="mark"></span><b>${esc(v.name)}</b>
      <em>${esc(v.city || 'city not on file')}${v.incumbent ? ' · incumbent' : ''}</em>`;
    c.onclick = async () => {
      const next = new Set(DRAFT.vendor_ids || []);
      next.has(v.vendor_id) ? next.delete(v.vendor_id) : next.add(v.vendor_id);
      c.classList.toggle('on');
      await patchDraft({vendor_ids: [...next]});
      drawVendors(); staleMail();
    };
    grid.appendChild(c);
  });
  b.body.appendChild(grid);
  b.setSub(`${chosen.size} of ${vs.length}`);
  actions(b, [
    [`Continue with ${plural(chosen.size, 'vendor')}`, 'go', () => {
      collapse(b, () => (DRAFT.vendor_ids || []).map(id =>
        (vs.find(v => v.vendor_id === id) || {}).name || id).join(', ') || 'nobody',
        drawVendors);
      stepQuestions();
    }, !chosen.size],
    ['Invite all ' + vs.length, 'alt', async () => {
      await patchDraft({vendor_ids: vs.map(v => v.vendor_id)}); drawVendors(); staleMail();
    }],
  ]);
}

/* ---------------- 3 · the questionnaire and the terms ---------------- */
function stepQuestions(){
  if (S.questions){ expand(S.questions); drawQuestions(); return; }
  const b = S.questions = box({n:'3', title:'What do you want to know about them?', key:'questions'});
  atEnd(b);
  const patch = {};
  if (!DRAFT.questions_chosen && !(DRAFT.question_nos || []).length)
    patch.question_nos = CAT.questions.map(q => q.q_no);
  // The questions the template itself gates on, carried over rather than
  // invented — this is last year's tender, and starting from it is the whole
  // reason an item master exists. Said on the card, and changeable.
  if (!(DRAFT.gating_q_nos || []).length && !DRAFT.questions_chosen)
    patch.gating_q_nos = (CAT.gate_preview || [])
      .filter(g => g.gating_now).map(g => g.q_no);
  // A date on the template from a tender that closed a fortnight ago is not a
  // default, it is a bug waiting to go out to five companies. Two weeks from
  // today, and it is an editable field rather than a fact.
  if (!DRAFT.response_due) patch.response_due = fortnight();
  if (Object.keys(patch).length) patchDraft(patch).then(drawQuestions);
  drawQuestions();
}

/* A question can be off, asked, or disqualifying. The third is the only one
   that can remove a vendor from the tender, so it says so on its face and it
   is a separate click from asking. */
function drawQuestions(){
  const b = S.questions; if (!b) return;
  const asked = new Set(DRAFT.question_nos || []);
  const gates = new Set(DRAFT.gating_q_nos || []);
  const prev = Object.fromEntries((CAT.gate_preview || []).map(g => [g.q_no, g]));

  b.body.replaceChildren();
  b.body.appendChild(el('div', 'lead',
    `${CAT.questions.length} questions on file. Tick the ones worth asking; mark
     a question <b>disqualifying</b> and an unsatisfactory answer ends that
     submission whatever the price — everything else is for information.` +
    (gates.size ? ` The ${gates.size} marked now are the ones last year's tender
     gated on; change them if this year is different.` : '')));

  b.body.appendChild(el('div', 'sechead', 'Questionnaire'));
  CAT.questions.forEach(q => {
    const on = asked.has(q.q_no), gate = gates.has(q.q_no);
    const row = el('div', 'qrow' + (on ? ' on' : ' off'));
    const hint = gate ? (prev[q.q_no] || {}).consequence
      : (!on && /lead time/i.test(q.question)
          ? 'Leave this out and the fastest-delivery option cannot be built — nobody will have told you how long they take'
          : '');
    row.innerHTML = `<span class="mark"></span>
      <div class="qt"><b>Q${q.q_no}</b>${esc(q.question)}` +
      (hint ? `<em>${esc(hint)}</em>` : '') + `</div>`;
    const g = el('button', 'gate' + (gate ? ' on' : ''),
      gate ? 'disqualifying' : 'make disqualifying');
    g.onclick = async e => {
      e.stopPropagation();
      const next = new Set(DRAFT.gating_q_nos || []);
      next.has(q.q_no) ? next.delete(q.q_no) : next.add(q.q_no);
      await patchDraft({gating_q_nos: [...next].sort((a, b) => a - b)});
      drawQuestions(); staleMail();
    };
    row.appendChild(g);
    row.onclick = async () => {
      const next = new Set(DRAFT.question_nos || []);
      next.has(q.q_no) ? next.delete(q.q_no) : next.add(q.q_no);
      await patchDraft({question_nos: [...next].sort((a, b) => a - b)});
      drawQuestions(); staleMail();
    };
    b.body.appendChild(row);
  });

  /* Terms are here because they are a question too — the one every vendor
     answers by quoting a number that is not comparable with anyone else's
     until it is adjusted back to these days. */
  b.body.appendChild(el('div', 'sechead', 'Terms'));
  const terms = el('div', 'terms');
  const opts = (CAT.terms_preview || []).map(t => t.days);
  (opts.length ? opts : [30, 45, 60, 90]).forEach(days => {
    const t = el('button', DRAFT.payment_terms_days === days ? 'on' : '', days + ' days');
    t.onclick = async () => { await patchDraft({payment_terms_days: days});
                              drawQuestions(); staleMail(); };
    terms.appendChild(t);
  });
  b.body.appendChild(terms);
  const chosen = (CAT.terms_preview || []).find(t => t.days === DRAFT.payment_terms_days);
  b.body.appendChild(el('div', 'consq', chosen
    ? esc(chosen.consequence) + ' · ' + esc(chosen.basis)
    : 'Payment terms not decided. Every landed cost is adjusted to them, so they '
      + 'decide who looks cheapest — this is not a formality.'));

  const dueRow = el('div', 'fieldrow');
  dueRow.innerHTML = `<label for="due">Responses due</label>`;
  const due = document.createElement('input');
  due.type = 'date'; due.id = 'due';
  due.value = DRAFT.response_due || '';
  due.onchange = async () => { await patchDraft({response_due: due.value});
                               staleMail(); b.setSub(subQ()); };
  dueRow.appendChild(due);
  dueRow.appendChild(el('span', 'pcount', 'two weeks out unless you move it'));
  b.body.appendChild(dueRow);

  function subQ(){
    return `${asked.size} asked · ${gates.size} disqualifying`;
  }
  b.setSub(subQ());
  // Payment terms are named rather than defaulted: silently filling them in is
  // how a buyer ends up with quotes they cannot compare and no idea why. A
  // disabled button with no explanation is its own bug, so it says what it is
  // waiting for.
  const ready = DRAFT.payment_terms_days != null;
  actions(b, [
    [ready ? 'Continue to the mail' : 'Pick payment terms to continue', 'go', () => {
      collapse(b, () => `${plural((DRAFT.question_nos || []).length, 'question')}, `
        + `${(DRAFT.gating_q_nos || []).length} disqualifying, `
        + `${DRAFT.payment_terms_days}-day terms`, drawQuestions);
      stepMail();
    }, !ready],
    ['Ask everything', 'alt', async () => {
      await patchDraft({question_nos: CAT.questions.map(q => q.q_no)});
      drawQuestions(); staleMail();
    }],
    ['Ask nothing', 'alt', async () => {
      await patchDraft({question_nos: [], gating_q_nos: []});
      drawQuestions(); staleMail();
    }],
  ]);
}

/* ---------------- 4 · the covering mail ---------------- */
/* Composed from the draft, not written by a model: change the terms and this
   changes, with nothing in the loop to paraphrase it into something almost
   right. Editable, because a buyer's own wording is the whole point of a
   covering note — and an edit un-approves it, so nothing rides out on the last
   approval. */
function staleMail(){
  if (S.mail && !S.mail.dataset.sent) S.mail.dataset.stale = '1';
  if (S.mail && !S.mail.dataset.sent && !S.mail.classList.contains('done')) drawMail();
}

async function stepMail(){
  if (S.mail){ expand(S.mail); drawMail(); return; }
  const b = S.mail = box({n:'4', title:'The covering mail', key:'mail'});
  atEnd(b);
  b.body.appendChild(el('div', 'status', 'composing…'));
  drawMail();
}

async function drawMail(){
  const b = S.mail; if (!b || b.dataset.sent) return;
  let m;
  try { m = await jget('/api/mail'); }
  catch (e){ b.body.replaceChildren(el('div', 'status', 'Could not compose: ' + esc(e.message)));
             return; }
  delete b.dataset.stale;
  const n = (m.to || []).length;
  b.body.replaceChildren();
  b.body.appendChild(el('div', 'lead',
    `This is the actual text, going to ${plural(n, 'company')}. Read it, change
     anything you want, then send it yourself. Nothing leaves until you do.`));

  const kv = el('table', 'kvt');
  kv.innerHTML = `<tr><th>To</th><td>${(m.to || []).map(esc).join(', ')}</td></tr>
    <tr><th>Subject</th><td></td></tr>
    <tr><th>Attached</th><td>${(m.attachments || []).map(a => '📎 ' + esc(a))
      .join('<br>')}</td></tr>`;
  const subj = document.createElement('input');
  subj.className = 'subj'; subj.value = m.subject || '';
  subj.setAttribute('aria-label', 'Subject');
  subj.onchange = () => patchDraft({mail_subject: subj.value});
  kv.querySelectorAll('td')[1].appendChild(subj);
  b.body.appendChild(kv);

  const body = document.createElement('textarea');
  body.className = 'mailbody'; body.value = m.body || '';
  body.setAttribute('aria-label', 'Mail body');
  const edited = el('div', 'edited'); edited.hidden = true;
  body.onchange = async () => {
    await patchDraft({mail_body: body.value});
    edited.textContent = 'Edited — your wording is what goes out.';
    edited.hidden = false;
  };
  b.body.append(body, edited);
  b.body.appendChild(el('div', 'stub', esc(m.stub_note || '')));

  b.setSub(`${plural(n, 'recipient')}`);
  actions(b, [
    [n ? `Send to ${plural(n, 'vendor')}` : 'Send', 'go', () => sendRfx(), !n],
    ['Recompose from the draft', 'alt', async () => {
      await patchDraft({mail_body: '', mail_subject: ''});
      drawMail();
    }],
    ['Check the line items', 'alt', () => stepItems()],
    ['Check the vendors', 'alt', () => stepVendors()],
  ]);
}

/* ===========================================================================
   THE ROUND
   ---------------------------------------------------------------------------
   A procurement round is not an instant. Mail goes out, replies come back one
   at a time in whatever format the vendor felt like, and for most of the week
   the buyer's real question is "where has this got to". Every line in this card
   is true: extraction runs per document and takes real time, the formats are
   the formats, the line counts are what came out. The one fiction is the send,
   and it says so on its own row.
   ======================================================================== */
async function sendRfx(){
  const mail = S.mail;
  if (mail){
    mail.dataset.sent = '1';
    collapse(mail, 'sent — the text is above', null);
    // Keep the mail readable after it has gone out, without the editor.
    mail.body.hidden = false;
    mail.body.querySelectorAll('textarea').forEach(t => {
      const ro = el('div', 'mailbody-ro', esc(t.value)); t.replaceWith(ro);
    });
    mail.body.querySelectorAll('input').forEach(i => {
      const s = el('span', '', esc(i.value)); i.replaceWith(s);
    });
    mail.body.querySelectorAll('.lead').forEach(x => x.remove());
  }
  await patchDraft({mail_approved: true});

  const b = S.round = box({title:'The round', key:'round'});
  atEnd(b);
  drawRound({state:'sending', vendors: (DRAFT.vendor_ids || []).map(v => ({
    vendor_id: v, name: (CAT.vendors.find(x => x.vendor_id === v) || {}).name || v,
    state:'mail sent', note:'stubbed — no mail left the building'}))});

  const res = await fetch('/api/issue', {method:'POST'});
  if (!res.ok){
    const why = await res.text();
    b.body.appendChild(el('div', 'status', 'Could not send: ' + esc(why.slice(0, 200))));
    if (mail){ delete mail.dataset.sent; expand(mail); drawMail(); }
    return;
  }
  const rd = res.body.getReader(); const dec = new TextDecoder(); let buf = '';
  while (true){
    const {done, value} = await rd.read(); if (done) break;
    buf += dec.decode(value, {stream:true});
    const parts = buf.split('\n\n'); buf = parts.pop();
    for (const p of parts){
      if (!p.startsWith('data: ')) continue;
      let m; try { m = JSON.parse(p.slice(6)); } catch (e){ continue; }
      if (m.kind === 'round'){ ROUND = m.payload; drawRound(ROUND); }
      if (m.kind === 'done' && m.payload && m.payload.phase === 'comparison'){
        await enterResults({});
      }
    }
  }
}

function drawRound(r){
  const b = S.round; if (!b || !r) return;
  ROUND = r;
  const done = (r.vendors || []).filter(v => v.state === 'quote read').length;
  b.body.replaceChildren();
  b.body.appendChild(el('div', 'lead',
    r.state === 'complete'
      ? `All ${r.vendors.length} replies are in and read. Five formats, one
         schedule — the table is below.`
      : `Sent. Replies come back in whatever format the vendor uses, and each one
         is read as it lands.`));
  const t = el('table', 'round');
  const tb = document.createElement('tbody');
  (r.vendors || []).forEach(v => {
    const tr = document.createElement('tr');
    tr.className = v.state === 'quote read' ? 'done'
      : (v.state === 'mail sent' || v.state === 'awaiting reply') ? 'wait' : '';
    tr.innerHTML = `<td class="v">${esc(v.name)}</td><td class="s">${esc(v.state)}</td>
      <td class="n">${esc(v.note || '')}</td>`;
    tb.appendChild(tr);
  });
  t.appendChild(tb);
  b.body.appendChild(t);
  if (r.error) b.body.appendChild(el('div', 'status', 'Failed: ' + esc(r.error)));
  b.body.appendChild(el('div', 'stub',
    'The send is stubbed — no mail left the building. Everything after it is real '
    + 'work on real documents: the replies are read one at a time, and the times '
    + 'are measured rather than staged.'));
  b.setSub(`${done} of ${(r.vendors || []).length} read`);
}

/* ===========================================================================
   THE RESULTS
   ---------------------------------------------------------------------------
   In the order a buyer reads them: what came back, the table itself, what it
   means and what to do about it, and then the mails that fill in what is still
   missing. All in the column, none of it behind a control.
   ======================================================================== */
async function enterResults(o){
  if (S.results) return;
  S.results = true;
  PHASE = 'comparison';
  STATE = await jget('/api/state');
  headerMeta();
  $('#q').placeholder = 'Ask about the comparison…';
  $('#chipAsm').hidden = false;
  const chip = $('#chipReview');
  if (STATE.open_reviews){
    chip.hidden = false;
    chip.textContent = STATE.open_reviews + ' need review';
    chip.onclick = showReviews;
  } else { chip.hidden = true; }

  // A reload mid-tender lands on a page with no story. Put the round back.
  if (o.restored){
    if (ROUND && ROUND.state && ROUND.state !== 'idle'){
      S.round = box({title:'The round', key:'round'});
      atEnd(S.round); drawRound(ROUND);
      collapse(S.round, `${(ROUND.vendors || []).length} replies read`, null);
    }
    say('Analyst', `<p>Picking up where this tender left off — the responses are
      in and read.</p>`);
  }
  narrate();
  comparisonCard(STATE.comparison);
  await summaryCard();
  await gapsCard();
  suggest(['Where are you unsure?',
           'Cheapest per line among vendors who cleared the questionnaire',
           'Which vendors’ certifications are actually valid?',
           'If I take that split, does anyone fall below their minimum order?',
           'Where is the money?']);
}

/* What every vendor did to make their quote incomparable. "0 of 134 cells were
   comparable as quoted" is true and reads as a boast nobody can check; this
   verifies itself against five documents that are one click away. */
function narrate(){
  const c = STATE.counts, dq = STATE.vendors.filter(v => !v.qualified);
  const why = STATE.vendors.map(v => {
    const bits = [];
    if (v.currency && v.currency !== 'INR') bits.push('quoted in ' + esc(v.currency));
    if (v.incoterm && v.incoterm !== (STATE.rfx.required_incoterm || ''))
      bits.push(esc(String(v.incoterm).replace(/_/g, ' ')));
    if (v.tax_basis && /incl/i.test(v.tax_basis)) bits.push('tax-inclusive');
    if (v.payment_days != null &&
        String(STATE.rfx.required_payment_terms || '').indexOf(String(v.payment_days)) < 0)
      bits.push(v.payment_days + '-day terms');
    return bits.length ? `<li><b>${esc(v.name.split(' ')[0])}</b> — ${bits.join(', ')}</li>` : '';
  }).filter(Boolean).join('');
  say('Analyst', `<p>${STATE.vendors.length} responses in, in ${
    new Set(STATE.vendors.map(v => v.reply_format)).size} different formats. Every
    rate is landed to ₹ per buyer unit, pre-tax, adjusted to the ${
    esc(STATE.rfx.required_payment_terms)} the RFx asked for.</p>
    <p><b>Not one of the ${c.cells} cells was comparable as it arrived.</b> Each
    needed at least one adjustment before it could sit beside another:</p>
    <ul>${why}</ul>
    <p>${c.derived} cells came out of that. <b>${c.unresolved} could not be derived
    at all</b> and are shown as gaps, never as zero — there is a mail below that
    asks for what is missing.</p>` +
    (dq.length ? '<p>' + dq.map(v => `<b>${esc(v.name.split(' ')[0])}</b> did not clear
      the questionnaire — ${esc((v.disqualified_because[0] || '').toLowerCase())}.`)
      .join(' ') + '</p>' : ''));
}

/* ---------------- the price table, in the conversation ---------------- */
function comparisonCard(tb){
  const b = S.cmp || (S.cmp = atEnd(box({title:'Every quote, landed, per buyer unit', key:'cmp'})));
  b.body.replaceChildren();
  b.body.appendChild(el('div', 'legend',
    `<span><i class="e"></i>extracted</span><span><i class="d"></i>derived</span>
     <span><i class="u"></i>unresolved</span><span class="sep"></span>
     <span><i class="b"></i>cheapest on the line</span>
     <span><i class="r"></i>how far above it</span>`));
  b.body.appendChild(el('div', 'lead',
    `Click any number to see the pixels it came from. A red cell is a gap we
     refused to fill — not a zero, and not a no-quote.`));
  b.body.appendChild(buildGrid(tb));
  b.body.appendChild(el('div', 'foots',
    (tb.footnotes || []).map(esc).join(' &nbsp;·&nbsp; ')));
  b.setSub(`${tb.rows.length} lines · ${tb.columns.length - 3} vendors`);
  return b;
}

function buildGrid(tb){
  const wrap = el('div', 'gridwrap');
  const t = el('table', 'cmp');
  const thead = el('thead'); const tr = el('tr');
  tb.columns.forEach(c => { const th = el('th', c.numeric ? 'num' : '');
    th.textContent = c.label; tr.appendChild(th); });
  thead.appendChild(tr); t.appendChild(thead);
  const tbody = el('tbody');
  /* Rank within the LINE, not the column: what a buyer scans for is who is
     cheapest on this item and by how much. Magnitude is carried by bar LENGTH,
     not a colour ramp — the cell background is already spoken for by extracted
     / derived / unresolved, and a green-to-red wash would quietly rank an
     unresolved gap as "best", which is the exact error this system refuses. */
  const CAP = 0.30;
  tb.rows.forEach(row => {
    const r = el('tr');
    const nums = tb.columns.filter(c => c.numeric && c.key !== 'qty' && c.key !== 'line')
      .map(c => (row[c.key] || {}))
      .filter(x => typeof x.value === 'number' && x.state !== 'unresolved')
      .map(x => x.value);
    const best = nums.length ? Math.min(...nums) : null;
    tb.columns.forEach(c => {
      const cell = row[c.key] || {};
      const priced = typeof cell.value === 'number' && cell.state !== 'unresolved'
        && c.key !== 'qty' && c.key !== 'line';
      const isBest = priced && best !== null && cell.value === best && nums.length > 1;
      const td = el('td', (c.numeric ? 'num ' : '') + (c.key === 'item' ? 'item ' : '') +
        (cell.state && cell.state !== 'plain' ? 's-' + cell.state + ' ' : '') +
        (isBest ? 'best' : ''));
      if (c.key === 'item' || c.key === 'qty'){
        // The unit goes UNDER the quantity, visibly. A rate column showing 8.03
        // above 1,339.00 with the unit hidden is the exact comparison this
        // project is about not making.
        td.innerHTML = esc(cell.value) + (cell.note ? `<small>${esc(cell.note)}</small>` : '');
      } else {
        td.textContent = cell.value === null || cell.value === undefined ? '—' : cell.value;
        if (priced && best && !isBest){
          const over = (cell.value - best) / best;
          const bar = el('i', 'rank');
          bar.style.width = Math.min(over / CAP, 1) * 100 + '%';
          bar.title = `+${(over * 100).toFixed(1)}% over the best price on this line`;
          td.appendChild(bar);
        }
        if (cell.note) td.title = cell.note;
        if (cell.evidence_id) td.onclick = () => openEvidence(cell.evidence_id);
        else if (cell.state === 'unresolved' && cell.note)
          td.onclick = () => explainGap(cell.note);
      }
      r.appendChild(td);
    });
    tbody.appendChild(r);
  });
  t.appendChild(tbody);
  wrap.appendChild(t);
  return wrap;
}

function flashLine(line_no){
  if (!S.cmp) return;
  const rows = [...S.cmp.querySelectorAll('table.cmp tbody tr')];

  setTimeout(() => { tr.style.background = ''; }, 1400);

async function sendFollowup(v, host, foot){
  foot.querySelectorAll('button').forEach(x => x.disabled = true);
  const log = el('div', 'status', 'sending…');
  foot.appendChild(log);
  const res = await fetch('/api/followup/' + encodeURIComponent(v.vendor_id),
    {method:'POST'});
  if (!res.ok){ log.textContent = 'Could not send: ' + (await res.text()).slice(0, 140);
                return; }
  const rd = res.body.getReader(); const dec = new TextDecoder(); let buf = '';
  while (true){
    const {done, value} = await rd.read(); if (done) break;
    buf += dec.decode(value, {stream:true});
    const parts = buf.split('\n\n'); buf = parts.pop();
    for (const p of parts){
      if (!p.startsWith('data: ')) continue;
      let m; try { m = JSON.parse(p.slice(6)); } catch (e){ continue; }
      if (m.kind === 'status') log.textContent = m.payload.text;
      if (m.kind === 'error') log.textContent = m.payload.text;
      if (m.kind === 'applied') await applyFollowup(v, host, foot, m.payload);
    }
  }
}

/* A reply that only updated a display would be the same failure as a review
   queue that does not change the answer. The whole pipeline runs again, and
   this says what moved. */
async function applyFollowup(v, host, foot, p){
  host.classList.add('sent');
  foot.replaceChildren();
  const before = p.before, after = p.after;
  const moved = el('div', 'moved');
  const stat = (label, from, to, good) =>
    `<div>${esc(label)}<b class="${from === to ? '' : good}">${from} → ${to}</b></div>`;
  moved.innerHTML =
    stat('unresolved cells', before.unresolved, after.unresolved, 'dn') +
    stat('qualified vendors', before.qualified, after.qualified, 'up') +
    stat('cells needing review', before.open_reviews, after.open_reviews, 'dn');
  const bx = atEnd(box({title: v.vendor + ' replied', key:'moved'}));
  bx.body.appendChild(el('div', 'lead',
    (p.changed || []).length
      ? `They sent back: ${p.changed.map(esc).join(', ')}.` +
        (p.declined ? ' They declined to revise the rest.' : '')
      : 'They replied, and nothing in it changed a number.'));
  bx.body.appendChild(moved);
  bx.body.appendChild(el('div', 'stub',
    'Their reply is a document in this repo, read through the same extraction, '
    + 'matching and normalisation as the first round. Nothing here is a display '
    + 'update — the whole pipeline ran again.'));

  STATE = await jget('/api/state');
  headerMeta();
  comparisonCard(STATE.comparison);
  const chip = $('#chipReview');
  if (STATE.open_reviews){ chip.hidden = false;
    chip.textContent = STATE.open_reviews + ' need review'; chip.onclick = showReviews; }
  else chip.hidden = true;
  await summaryCard();
  await gapsCard();
  scrollEnd();
}

function renderOptions(b){
  const d = el('div', 'block');
  const cards = b.cards || [];
  const live = cards.filter(c => !c.unavailable);
  const base = (live.find(c => c.kind === 'cheapest') || {}).total_inr;
  // The heading counts what is on screen. It used to say "three ways" over two
  // cards, which reads as a bug and is actually a finding: the missing card
  // says why it is missing, in terms of a decision the buyer made.
  const title = b.title || `${live.length} way${live.length === 1 ? '' : 's'} to award this`;
  d.innerHTML = `<div class="sechead" style="margin-top:0;padding-top:0;border-top:0">${
    esc(title)}</div><div class="cards">` +
    cards.map(c => {
      if (c.unavailable){
        return `<div class="ocard off"><div class="lbl">${esc(c.label)}</div>
          <div class="cost na">not available</div>
          <div class="why">${esc(c.why)}</div></div>`;
      }
      const delta = (base != null && c.total_inr !== base)
        ? `<span class="delta">+${inr0(c.total_inr - base)}</span>` : '';
      return `<div class="ocard ${c.feasible ? '' : 'bad'}" data-strategy="${esc(c.strategy || '')}">
        <div class="lbl">${esc(c.label)}</div>
        <div class="cost">${inr0(c.total_inr)} ${delta}</div>
        <div class="facts">
          <span>${c.lead_time_days != null ? c.lead_time_days + ' days' : 'lead time unstated'}</span>
          <span>${plural(c.vendors.length, 'vendor')}</span>
          <span>${c.lines_covered}/${c.lines_total} lines</span>
        </div>
        <div class="who2">${c.vendor_names.map(esc).join(' · ')}</div>
        <div class="why">${esc(c.why)}</div>` +
        ((c.violations || []).length
          ? `<ul class="viol">${c.violations.slice(0, 2).map(v => `<li>${esc(v)}</li>`).join('')}</ul>`
          : '') +
        (c.feasible ? `<button class="pick">Award memo for this</button>` : '') +
        `</div>`;
    }).join('') + '</div>' +
    (b.note ? `<div class="why" style="color:var(--dim);font-size:11.5px">${esc(b.note)}</div>` : '');
  // Each card writes its own memo. Three options the buyer cannot act on
  // separately are a display, not a choice.
  d.querySelectorAll('.ocard .pick').forEach(btn => {
    btn.onclick = () => showMemo(btn.closest('.ocard').dataset.strategy);
  });
  return d;
}

/* Deliberately small: headings, bold, bullets, rules. The memo is markdown
   because it has to leave this tool and land in an email or a board pack. */
const mdDoc = src => esc(src)
  .replace(/^### (.+)$/gm, '<h5>$1</h5>')
  .replace(/^## (.+)$/gm, '<h4>$1</h4>')
  .replace(/^# (.+)$/gm, '<h3>$1</h3>')
  .replace(/^\s*[-*] (.+)$/gm, '<li>$1</li>')
  .replace(/(<li>[\s\S]*?<\/li>)(?!\s*<li>)/g, '<ul>$1</ul>')
  .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>')
  .replace(/^---$/gm, '<hr>')
  .replace(/\n{2,}/g, '</p><p>');
const mdish = s => '<p>' + esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>')
  .replace(/\n\n/g, '</p><p>').replace(/\n/g, '<br>') + '</p>';

async function showMemo(strategy){
  const b = atEnd(box({title:'Award memo', key:'memo'}));
  b.body.appendChild(el('div', 'status', 'writing it…'));
  try {
    const r = await jget('/api/memo' +
      (strategy ? '?strategy=' + encodeURIComponent(strategy) : ''));
    b.setSub(r.strategy || '');
    b.body.replaceChildren(el('div', 'md', '<p>' + mdDoc(r.markdown || '') + '</p>'));
  } catch (e){
    b.body.replaceChildren(el('div', 'status', 'Could not write it: ' + esc(e.message)));
  }
  scrollEnd();
}

/* ===========================================================================
   Where the money is
   ---------------------------------------------------------------------------
   Two questions the grid cannot answer, because a table sorted by line number
   hides both. Thirty lines look like thirty equal decisions; one layer-pad line
   is a quarter of the award. And a line only rewards negotiation if somebody
   else wanted it — the spread between best and worst is the closest thing an
   RFx has to a measure of how contested a line was.
   ======================================================================== */
const SPENDVIEW = {money:false, spread:false};

function tipShow(e, html){
  const t = $('#tip'); t.innerHTML = html; t.hidden = false;
  const r = t.getBoundingClientRect();
  let x = e.clientX + 14, y = e.clientY + 14;
  if (x + r.width > innerWidth - 8) x = e.clientX - r.width - 14;
  if (y + r.height > innerHeight - 8) y = e.clientY - r.height - 14;
  t.style.left = x + 'px'; t.style.top = y + 'px';
}
const tipHide = () => { $('#tip').hidden = true; };
/* There is deliberately no "hide it on any scroll" here. Scroll events are
   dispatched a frame LATE, so scrolling a bar into view and hovering it fired
   the hide AFTER the show and the tooltip never appeared — which is the
   difference between a hover layer and a hover layer that works except when
   you use it. Entering and leaving the bar is enough: the bar moves out from
   under the cursor when the page scrolls, and the browser fires the leave. */

function figure(o){
  const fig = el('div', 'fig');
  fig.innerHTML = `<h3>${esc(o.title)}</h3><div class="sub">${o.sub}</div>`;
  const rows = o.rows, n = rows.length;
  const H = 13, GAP = 2, LW = 34, RW = 84;
  const W = 760, plot = W - LW - RW;
  const max = Math.max(...rows.map(r => r.v)) || 1;
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.setAttribute('viewBox', `0 0 ${W} ${n * (H + GAP) + 6}`);
  svg.setAttribute('role', 'img');
  svg.setAttribute('aria-label', o.title + '. ' + o.alt);
  rows.forEach((r, i) => {
    const y = i * (H + GAP);
    const w = Math.max(1.5, (r.v / max) * plot);
    const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    g.innerHTML =
      `<text class="lbl" x="${LW - 6}" y="${y + H - 4}" text-anchor="end">L${r.line_no}</text>` +
      `<rect class="bar${r.tail ? ' tail' : ''}" x="${LW}" y="${y}" width="${w}" ` +
      `height="${H - 2}" rx="4" ry="4"></rect>` +
      (i < o.label_top ? `<text class="val" x="${LW + w + 6}" y="${y + H - 4}">${esc(r.label)}</text>` : '');
    const hit = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
    hit.setAttribute('x', 0); hit.setAttribute('y', y);
    hit.setAttribute('width', W); hit.setAttribute('height', H + GAP);
    hit.setAttribute('fill', 'transparent');
    hit.onmouseenter = ev => tipShow(ev, r.tip);
    hit.onmousemove = ev => tipShow(ev, r.tip);
    hit.onmouseleave = tipHide;
    hit.onclick = () => { tipHide(); flashLine(r.line_no); };
    g.appendChild(hit);
    svg.appendChild(g);
  });
  fig.appendChild(svg);
  const foot = el('div', 'foot');
  foot.appendChild(el('div', 'key',
    `<span><i class="a"></i>${esc(o.key_a)}</span><span><i class="t"></i>${esc(o.key_t)}</span>`));
  const toggle = el('button', 'mini', 'Show as a table');
  const holder = el('div');
  toggle.onclick = () => {
    SPENDVIEW[o.key] = !SPENDVIEW[o.key];
    toggle.textContent = SPENDVIEW[o.key] ? 'Show as a chart' : 'Show as a table';
    svg.hidden = SPENDVIEW[o.key];
    holder.replaceChildren(SPENDVIEW[o.key] ? o.table() : document.createComment(''));
  };
  foot.appendChild(toggle);
  fig.append(foot, holder);
  return fig;
}

function sheet(rows, cols){
  const t = el('table', 'sheet');
  t.innerHTML = '<thead><tr>' + cols.map(c =>
    `<th${c[2] ? ' class="num"' : ''}>${esc(c[0])}</th>`).join('') + '</tr></thead>';
  const tb = document.createElement('tbody');
  rows.forEach(r => {
    const tr = document.createElement('tr');
    tr.innerHTML = cols.map(c => `<td${c[2] ? ' class="num"' : ''}>${esc(c[1](r))}</td>`).join('');
    tb.appendChild(tr);
  });
  t.appendChild(tb);
  return t;
}

        + `<span class="m">${inr0(x.annual_inr)} a year at the best rate</span>`})),
    table: () => sheet(spread, [
      ['Line', x => x.line_no, true], ['Item', x => x.description.slice(0, 52), false],
      ['Best ₹', x => inr(x.best_inr), true], ['Worst ₹', x => inr(x.worst_inr), true],
      ['Spread', x => x.spread_pct.toFixed(1) + '%', true]]),

  b.body.replaceChildren(moneyFig, spreadFig);
