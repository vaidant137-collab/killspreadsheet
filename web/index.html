<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kill the Quote Spreadsheet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:wght@400;500&family=Public+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --paper:#F1F0EC; --surface:#FAFAF8; --surface-2:#E8E7E1; --ink:#16191C;
  --ink-soft:#585F66; --ink-faint:#8B9198; --rule:#D8D6CE; --rule-soft:#E4E2DA;
  --accent:#17416B; --accent-soft:#E2EAF2;
  --ok:#2F6F4E; --derived:#8A6110; --derived-bg:#F6EEDC; --derived-line:#D9BC7A;
  --risk:#9E2C2C; --risk-bg:#F7E6E4; --risk-line:#DFA9A3;
  --dim:var(--ink-soft); --warn:var(--derived); --good:var(--ok);
  --rank:#5B8DB8;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --paper:#14171A; --surface:#1B1F23; --surface-2:#23282D; --ink:#E7E5DF;
  --ink-soft:#A3AAB1; --ink-faint:#6F777E; --rule:#2C3237; --rule-soft:#242A2F;
  --accent:#7FADD6; --accent-soft:#1D2A38;
  --ok:#79BF97; --derived:#D6AC5E; --derived-bg:#2B2415; --derived-line:#6B5A2F;
  --risk:#E08B84; --risk-bg:#301E1C; --risk-line:#6E3B36;
  --rank:#5E8CB4; color-scheme:dark;}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);
  font-family:"Public Sans",system-ui,sans-serif;font-size:14px;line-height:1.55;
  -webkit-font-smoothing:antialiased;display:flex;flex-direction:column}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace}

.block.options{padding:0}
.block.options .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(228px,1fr));
  gap:12px;margin-bottom:14px}
.block.options .card{border:1px solid var(--rule);border-radius:7px;
  padding:15px 16px 16px;background:var(--surface);position:relative;
  display:flex;flex-direction:column;gap:7px}
/* The recommendation is a recommendation. One accent rule says so without a
   badge, a colour wash, or the word "best" — all of which would overclaim on a
   number that rests on seven unresolved cells. */
.block.options .card:first-child::before{content:"";position:absolute;left:-1px;right:-1px;
  top:-1px;height:2px;background:var(--accent);border-radius:7px 7px 0 0}
.block.options .card.bad{border-color:var(--risk-line);background:var(--risk-bg)}
.block.options .lbl{font-family:"IBM Plex Mono",monospace;font-size:9.5px;
  letter-spacing:.09em;text-transform:uppercase;color:var(--dim);margin:0}
.block.options .cost{font-family:Newsreader,Georgia,serif;font-size:1.62rem;
  line-height:1;margin:0;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.block.options .delta{font-family:"IBM Plex Mono",monospace;font-size:10.5px;
  color:var(--dim);vertical-align:middle;margin-left:3px}
.block.options .facts{display:flex;flex-wrap:wrap;gap:4px 12px;
  font-family:"IBM Plex Mono",monospace;font-size:10px;color:var(--dim);margin:0;
  padding-bottom:8px;border-bottom:1px solid var(--rule-soft)}
.block.options .who{font-size:11.5px;margin:0;line-height:1.45}
.block.options .why{font-size:11.5px;color:var(--dim);line-height:1.5;margin:0}
.block.options .viol{margin:0;padding-left:15px;font-size:11px;color:var(--risk)}
.block.options .note{font-size:11px;color:var(--dim);margin:0 0 12px}
.block.memo .md{font-size:13px;line-height:1.6}
.block.memo h3{font-family:Newsreader,Georgia,serif;font-weight:500;font-size:1.15rem;margin:.2em 0 .5em}
.block.memo h4{font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--dim);margin:1.4em 0 .5em}
.block.memo h5{font-size:12.5px;margin:1em 0 .3em}
.block.memo ul{padding-left:18px;margin:.4em 0}
.block.memo hr{border:0;border-top:1px solid var(--rule);margin:1.2em 0}

.block.draft,.block.mail{border:1px solid var(--rule);border-radius:6px;padding:14px 16px;
  background:var(--surface)}
.block.draft{border-left:2px solid var(--accent)}

/* ---------- artifact tabs and pickers ---------- */
nav.tabs{display:flex;gap:2px}
nav.tabs button{font:inherit;font-size:11.5px;cursor:pointer;background:none;
  border:0;border-bottom:2px solid transparent;color:var(--ink-faint);
  padding:3px 9px 5px}
nav.tabs button:hover{color:var(--ink)}
nav.tabs button.on{color:var(--ink);border-bottom-color:var(--accent)}
.panel{overflow:auto;padding:14px 20px 18px;flex:1;min-height:0}
.panel .empty{color:var(--dim);font-size:12.5px;padding:18px 0;max-width:52ch;
  line-height:1.6}
.phead{display:flex;align-items:center;gap:12px;margin-bottom:11px}
.phead select.catsel{font:inherit;font-size:12px;background:var(--surface);
  color:var(--ink);border:1px solid var(--rule);border-radius:4px;padding:5px 8px}
.pcount{font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--dim)}
.pfoot{display:flex;gap:8px;margin-top:12px}
.rgroup{border:1px solid var(--rule);border-left:2px solid var(--derived);
  border-radius:6px;padding:12px 13px 10px;margin:0 0 9px;background:var(--surface)}
.rgroup.done{opacity:.5;border-left-color:var(--ok)}
.rgroup .top{display:flex;align-items:baseline;gap:9px;margin-bottom:5px}
.rgroup .top b{font-weight:500;font-size:13px;flex:1}
.rgroup .n,.rgroup .conf{font-family:"IBM Plex Mono",monospace;font-size:10px;
  color:var(--dim);white-space:nowrap}
.rgroup .why{font-size:12px;line-height:1.5;color:var(--ink-soft);max-width:62ch}
.rgroup .who2{font-family:"IBM Plex Mono",monospace;font-size:10px;color:var(--ink-faint);
  margin-top:5px}
.rfoot{display:flex;gap:8px;margin-top:10px;align-items:center}
.rfoot .go,.rfoot .other{font:inherit;font-size:11px;cursor:pointer;border-radius:4px;
  padding:5px 11px;border:1px solid var(--rule);background:none;color:var(--ink-soft)}
.rfoot .go{background:var(--accent);border-color:var(--accent);color:#fff}
.rfoot button:disabled{cursor:default;opacity:.6}
.rcells{margin-top:9px;padding-top:9px;border-top:1px solid var(--rule-soft)}
.fixrow{display:flex;gap:6px;margin-top:8px;align-items:center}
.fixrow input{font:inherit;font-size:12px;flex:1;min-width:0;padding:5px 8px;
  border:1px solid var(--accent);border-radius:4px;background:var(--surface);
  color:var(--ink)}
.fixrow button{font:inherit;font-size:11px;cursor:pointer;border-radius:4px;
  padding:5px 10px;border:1px solid var(--rule);background:none;color:var(--ink-soft)}
.fixrow button.go{background:var(--accent);border-color:var(--accent);color:#fff}
.pfoot .go,.pfoot .other{font:inherit;font-size:11px;cursor:pointer;border-radius:4px;
  padding:5px 11px;border:1px solid var(--rule);background:none;color:var(--ink-soft)}
.pfoot .go{background:var(--accent);border-color:var(--accent);color:#fff}

table.pick{width:100%;border-collapse:collapse;font-size:12.5px}
table.pick th{text-align:left;font-family:"IBM Plex Mono",monospace;font-size:9.5px;
  letter-spacing:.06em;text-transform:uppercase;color:var(--dim);
  padding:0 10px 6px 0;border-bottom:1px solid var(--rule)}
table.pick th.num,table.pick td.num{text-align:right}
table.pick td{padding:6px 10px 6px 0;border-bottom:1px solid var(--rule-soft);
  vertical-align:top}
table.pick td small{display:block;font-size:10px;color:var(--dim);
  font-family:"IBM Plex Mono",monospace}
table.pick tbody tr{cursor:pointer}
table.pick tbody tr:hover{background:var(--surface-2)}
table.pick .mark{display:inline-block;width:12px;height:12px;border-radius:3px;
  border:1px solid var(--rule);margin-top:2px}
table.pick tr.on .mark{background:var(--accent);border-color:var(--accent);
  box-shadow:inset 0 0 0 2px var(--surface)}

.pbody.vendors{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));
  gap:9px}
.vcard{text-align:left;font:inherit;cursor:pointer;background:var(--surface);
  border:1px solid var(--rule);border-radius:6px;padding:11px 12px;color:var(--ink);
  display:flex;flex-direction:column;gap:3px;position:relative}
.vcard:hover{border-color:var(--ink-faint)}
.vcard.on{border-color:var(--accent);box-shadow:inset 2px 0 0 var(--accent)}
.vcard .mark{position:absolute;top:11px;right:11px;width:12px;height:12px;
  border-radius:3px;border:1px solid var(--rule)}
.vcard.on .mark{background:var(--accent);border-color:var(--accent);
  box-shadow:inset 0 0 0 2px var(--surface)}
.vcard b{font-weight:500;font-size:12.5px;padding-right:18px}
.vcard em{font-style:normal;font-size:11px;color:var(--dim)}

.block.choice{border:1px solid var(--rule);border-radius:6px;padding:13px 14px 11px;
  background:var(--surface)}
.block.choice.done{opacity:.55}
.block.choice .h{font-family:"IBM Plex Mono",monospace;font-size:9.5px;
  letter-spacing:.08em;text-transform:uppercase;color:var(--dim);margin-bottom:9px}
.block.choice .opts{display:flex;flex-direction:column;gap:1px}
.block.choice .opt{display:flex;align-items:flex-start;gap:9px;width:100%;
  text-align:left;background:none;border:0;border-radius:4px;padding:7px 9px;
  cursor:pointer;color:var(--ink);font:inherit;font-size:12.5px;line-height:1.4}
.block.choice .opt:hover{background:var(--surface-2)}
.block.choice .opt .mark{flex:none;width:12px;height:12px;margin-top:3px;
  border:1px solid var(--rule);border-radius:3px}
.block.choice .opt.on .mark{background:var(--accent);border-color:var(--accent);
  box-shadow:inset 0 0 0 2px var(--surface)}
.block.choice .opt .txt{display:block}
.block.choice .opt em{display:block;font-style:normal;font-size:11px;
  color:var(--dim);margin-top:1px}
.block.choice .cnote{font-family:"IBM Plex Mono",monospace;font-size:10px;
  color:var(--ink-faint);margin-top:9px;line-height:1.5}
.block.choice .foot{display:flex;gap:8px;margin-top:10px;padding-top:9px;
  border-top:1px solid var(--rule-soft)}
.block.choice .go,.block.choice .other{font:inherit;font-size:11px;cursor:pointer;
  border-radius:4px;padding:5px 11px;border:1px solid var(--rule);
  background:none;color:var(--ink-soft)}
.block.choice .go{background:var(--accent);border-color:var(--accent);color:#fff}
.block.choice button:disabled{cursor:default;opacity:.7}
.block.draft .h,.block.mail .h{font-family:"IBM Plex Mono",monospace;font-size:9.5px;
  letter-spacing:.08em;text-transform:uppercase;color:var(--dim);margin-bottom:10px}
table.draft{width:100%;border-collapse:collapse;font-size:12.5px}
table.draft th{text-align:left;vertical-align:top;white-space:nowrap;width:150px;
  font-weight:400;color:var(--dim);padding:5px 14px 5px 0;
  border-bottom:1px solid var(--rule)}
table.draft td{padding:5px 0;border-bottom:1px solid var(--rule)}
table.draft .chg{font-size:11px;color:var(--dim);margin-top:2px;font-style:italic}
.block.draft .gaps{margin-top:11px;font-size:11.5px;color:var(--warn)}
.block.draft .ok{margin-top:11px;font-size:11.5px;color:var(--good)}
.mailbody{white-space:pre-wrap;font-family:"Public Sans",system-ui,sans-serif;
  font-size:12.5px;line-height:1.55;margin:12px 0 10px;padding:12px 14px;
  background:var(--bg);border-left:2px solid var(--rule);border-radius:0 4px 4px 0}
.block.mail .attach{font-size:11px;color:var(--dim);margin-bottom:10px}
.block.mail .stub{font-size:11px;color:var(--dim);border-top:1px solid var(--rule);
  padding-top:9px;font-style:italic}

.src details.sheet{margin-bottom:12px}
.src details.sheet summary{font-family:"IBM Plex Mono",monospace;font-size:10px;
  letter-spacing:.06em;text-transform:uppercase;color:var(--dim);cursor:pointer;
  padding:5px 0}
table.grid{border-collapse:collapse;font-family:"IBM Plex Mono",monospace;
  font-size:10.5px;width:100%;table-layout:fixed}
table.grid td{border:1px solid var(--rule);padding:3px 5px;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap;max-width:110px}
table.grid td.hid{opacity:.45;font-style:italic}
table.grid td.hit{background:var(--accent-soft);outline:1.5px solid var(--accent);
  outline-offset:-1.5px}
table.grid tr.hit td{background:var(--accent-soft)}
.src h5{font-size:12px;margin:1em 0 .3em}
.src p{font-size:12px;line-height:1.55;margin:.4em 0}

table.prov{width:100%;border-collapse:collapse;margin-top:10px;font-size:11px}
table.prov th{text-align:left;font-family:"IBM Plex Mono",monospace;font-size:9.5px;
  letter-spacing:.06em;text-transform:uppercase;color:var(--dim);
  padding:4px 10px 4px 0;border-bottom:1px solid var(--rule)}
table.prov td{padding:4px 10px 4px 0;border-bottom:1px solid var(--rule)}

/* ---------- header ---------- */
header{border-bottom:1px solid var(--rule);background:var(--surface);
  padding:12px 20px;display:flex;gap:18px;align-items:baseline;flex-wrap:wrap;flex:none}
header h1{font-family:Newsreader,Georgia,serif;font-weight:500;font-size:1.15rem;margin:0;
  letter-spacing:-.01em;white-space:nowrap}
header .meta{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.05em;
  text-transform:uppercase;color:var(--ink-faint);display:flex;gap:16px;flex-wrap:wrap}
header .meta b{color:var(--ink);font-weight:500}
header .spacer{flex:1}
.chip{font-family:"IBM Plex Mono",monospace;font-size:10.5px;font-weight:600;
  padding:3px 8px;border-radius:2px;letter-spacing:.04em;cursor:pointer;border:0}
.chip.warn{background:var(--derived-bg);color:var(--derived)}
.chip.risk{background:var(--risk-bg);color:var(--risk)}

/* ---------- layout ---------- */
main{flex:1;display:grid;grid-template-columns:minmax(0,1fr);min-height:0}
#stage{display:flex;flex-direction:column;min-height:0;min-width:0}

/* ---------- pinned comparison ---------- */
#pinned{border-bottom:1px solid var(--rule);background:var(--surface);
  display:flex;flex-direction:column;min-height:0;max-height:48vh}
/* An id selector with `display` outranks the UA's [hidden] rule, so el.hidden
   silently does nothing here. Say it explicitly. */
#pinned[hidden]{display:none}
#pinned .bar{display:flex;align-items:baseline;gap:12px;padding:9px 20px 7px;flex:none}
#pinned .bar h2{font-size:.86rem;font-weight:600;margin:0}
#pinned .bar .sub{font-family:"IBM Plex Mono",monospace;font-size:10px;color:var(--ink-faint);
  letter-spacing:.04em}
#pinned .bar .right{margin-left:auto;display:flex;gap:14px;align-items:center}
.legend{display:flex;gap:12px;font-size:10.5px;color:var(--ink-soft);align-items:center}
.legend i{width:11px;height:11px;display:inline-block;border:1px solid var(--rule);
  margin-right:5px;vertical-align:-1px}
.legend .d{background:var(--derived-bg);border-color:var(--derived-line)}
.legend .u{background:var(--risk-bg);border-color:var(--risk-line)}
.legend .b{background:var(--accent);border:0;width:2px;height:12px}
.legend .r{background:var(--rank);border:0;width:14px;height:2px;opacity:.75}
.legend .sep{width:1px;height:12px;background:var(--rule)}
#pinned.folded{max-height:none}
#pinned.folded .panel,#pinned.folded #tableWrap,#pinned.folded #foot{display:none}
#pinned .bar .fold{font:inherit;font-size:13px;line-height:1;cursor:pointer;
  background:none;border:1px solid var(--rule);border-radius:4px;color:var(--ink-faint);
  padding:2px 7px;order:-1}
#pinned .bar .fold:hover{color:var(--ink);border-color:var(--ink-faint)}
#pinned.folded .bar .fold{transform:rotate(180deg)}

table.round{width:100%;border-collapse:collapse;font-size:12.5px}
table.round td{padding:7px 10px 7px 0;border-bottom:1px solid var(--rule-soft);
  vertical-align:top}
table.round td.v{font-weight:500;width:230px}
table.round td.s{width:150px;font-family:"IBM Plex Mono",monospace;font-size:10.5px;
  letter-spacing:.04em;text-transform:uppercase}
table.round tr.done td.s{color:var(--ok)}
table.round tr.wait td.s{color:var(--warn)}
table.round td.n{font-size:11.5px;color:var(--dim)}
.roundhead{display:flex;align-items:baseline;gap:10px;margin-bottom:11px}
.roundhead b{font-weight:500;font-size:13px}
.roundhead .st{font-family:"IBM Plex Mono",monospace;font-size:10px;color:var(--dim);
  text-transform:uppercase;letter-spacing:.06em}
.roundnote{margin-top:11px;font-size:11.5px;color:var(--dim);max-width:60ch;line-height:1.55}

.block.mail .mailfull{max-height:none}
.block.mail .verify{margin-top:10px;padding-top:9px;border-top:1px solid var(--rule-soft);
  font-size:12px;color:var(--ink-soft);line-height:1.5}
#tableWrap{overflow:auto;min-height:0}
#tableWrap td.num small{display:block;font-size:9.5px;color:var(--ink-faint);
  font-family:"IBM Plex Mono",monospace;letter-spacing:.02em;margin-top:1px}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:12.5px}
thead th{position:sticky;top:0;z-index:2;background:var(--surface-2);
  font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.06em;
  text-transform:uppercase;color:var(--ink-soft);font-weight:600;text-align:left;
  padding:7px 10px;border-bottom:1px solid var(--rule);white-space:nowrap}
thead th.num{text-align:right}
tbody td{padding:5px 10px;border-bottom:1px solid var(--rule-soft);vertical-align:top}
tbody td.num{text-align:right;font-family:"IBM Plex Mono",monospace;
  font-variant-numeric:tabular-nums;white-space:nowrap;cursor:pointer}
tbody td.num:hover{outline:1.5px solid var(--accent);outline-offset:-1.5px}
td.s-derived{background:var(--derived-bg);box-shadow:inset 2px 0 0 var(--derived-line)}
td.s-unresolved{background:var(--risk-bg);box-shadow:inset 2px 0 0 var(--risk-line);
  color:var(--risk);font-weight:600}
td.s-extracted{background:transparent}

/* Price rank. A 2px mark, not a wash: length is the magnitude channel and the
   background stays reserved for cell state. #5B8DB8 clears 3:1 on the light
   surface and #5E8CB4 clears 4.6:1 on the dark one. */
tbody td.num{position:relative}
tbody td.num i.rank{position:absolute;left:6px;bottom:3px;height:2px;border-radius:1px;
  background:var(--rank);opacity:.75;max-width:calc(100% - 12px);pointer-events:none}
tbody td.best{font-weight:500}
tbody td.best::before{content:"";position:absolute;left:0;top:4px;bottom:4px;width:2px;
  background:var(--accent);border-radius:1px}
td.item{max-width:340px;font-size:12px;line-height:1.35}
td.item small{display:block;color:var(--ink-faint);font-family:"IBM Plex Mono",monospace;
  font-size:9.5px;letter-spacing:.03em}
tr.flash td{animation:flash .9s ease-out}
@keyframes flash{0%{background:var(--accent-soft)}100%{}}
#foot{padding:7px 20px;font-size:11px;color:var(--ink-soft);border-top:1px solid var(--rule-soft);flex:none}

/* ---------- chat ---------- */
#chat{flex:1;overflow:auto;padding:18px 20px 8px;min-height:0}
.turn{max-width:78ch;margin:0 0 16px}
.turn.you{margin-left:auto;text-align:right}
.turn.you .bubble{display:inline-block;background:var(--accent);color:#fff;
  padding:7px 13px;border-radius:3px;text-align:left;font-size:13.5px}
.who{font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.11em;
  text-transform:uppercase;color:var(--ink-faint);margin-bottom:5px;font-weight:600}
.block{margin:0 0 10px}
.block p{margin:0 0 8px}
.status{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink-faint)}
details.qry{border-left:2px solid var(--rule);padding-left:10px;margin:6px 0}
details.qry summary{cursor:pointer;font-family:"IBM Plex Mono",monospace;font-size:10.5px;
  color:var(--ink-faint);letter-spacing:.05em}
details.qry pre{font-family:"IBM Plex Mono",monospace;font-size:11px;white-space:pre-wrap;
  background:var(--surface);padding:9px 11px;margin:6px 0 0;overflow-x:auto;
  border:1px solid var(--rule-soft)}
.refusal{border-left:3px solid var(--derived);background:var(--surface);padding:12px 15px}
.refusal .h{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.11em;
  text-transform:uppercase;color:var(--derived);font-weight:600;margin-bottom:5px}
.refusal ul{margin:7px 0 0;padding-left:18px;font-size:12.5px;color:var(--ink-soft)}
.card{border:1px solid var(--rule);background:var(--surface);padding:11px 13px;margin:0 0 8px}
.card .top{display:flex;gap:10px;align-items:baseline;margin-bottom:5px}
.card .conf{font-family:"IBM Plex Mono",monospace;font-size:10.5px;font-weight:600;
  color:var(--risk);background:var(--risk-bg);padding:2px 6px;border-radius:2px}
.card .why{font-size:12px;color:var(--ink-soft);margin:4px 0 8px}
.card button{font-size:11.5px;padding:4px 10px;margin-right:6px;border:1px solid var(--rule);
  background:var(--surface-2);color:var(--ink);cursor:pointer;border-radius:2px;
  font-family:inherit}
.card button:hover{border-color:var(--accent);color:var(--accent)}
.asm{width:100%;font-size:12px}
.asm td{padding:4px 8px;border-bottom:1px solid var(--rule-soft)}
.asm input{width:88px;font-family:"IBM Plex Mono",monospace;font-size:11.5px;
  background:var(--surface);color:var(--ink);border:1px solid var(--rule);padding:2px 5px}

/* ---------- composer ---------- */

  font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.04em;
  text-transform:uppercase;padding-top:2px}

  font-size:12px;margin:0 0 12px}

  letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint)}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<header>
  <h1>Kill the Quote Spreadsheet</h1>
  <!-- The header used to recite the state of the data — "NO RFX YET · ITEM
       MASTER 30 LINES · APPROVED VENDORS 5". None of it was actionable and all
       of it is visible elsewhere. What belongs here is where you are, and the
       two things that need your attention. -->
  <div class="meta" id="meta"></div>
  <div class="spacer"></div>
  <button class="chip risk" id="chipReview" hidden></button>
  <button class="chip warn" id="chipAsm">assumptions</button>
</header>

<main>
  <div id="stage">
    <section id="pinned">
      <div class="bar">
        <!-- Tabs live INSIDE the artifact, not beside the chat: picking line
             items is editing the RFx, so the picker belongs with it. -->
        <nav class="tabs" id="tabs">
          <button data-tab="main" class="on" id="tabMain">RFx draft</button>
          <button data-tab="options" id="tabOptions" hidden>Options</button>
          <button data-tab="round" id="tabRound" hidden>Round</button>
          <button data-tab="items">Item master</button>
          <button data-tab="vendors">Vendors</button>
        </nav>
        <span class="sub" id="pinSub"></span>
        <div class="right">
          <button class="fold" id="fold" title="Collapse this panel"
                  aria-label="Collapse this panel">⌃</button>
          <div class="legend" id="legend">
            <span><i class="e"></i>extracted</span>
            <span><i class="d"></i>derived</span>
            <span><i class="u"></i>unresolved</span>
            <span class="sep"></span>
            <span><i class="b"></i>cheapest on the line</span>
            <span><i class="r"></i>how far above it</span>
          </div>
        </div>
      </div>
      <div id="tableWrap"></div>
      <div id="panelDraft" class="panel" hidden></div>
      <div id="panelOptions" class="panel" hidden></div>
      <div id="panelItems" class="panel" hidden></div>
      <div id="panelVendors" class="panel" hidden></div>
      <div id="panelRound" class="panel" hidden></div>
      <div id="foot"></div>
    </section>

    <div id="chat"></div>

    <div id="composer">
      <form id="f">
        <input id="q" autocomplete="off" placeholder="Tell me what you need to buy…">
        <button type="submit">Ask</button>
      </form>
      <div class="suggest" id="suggest"></div>
    </div>
  </div>
</main>

<div id="scrim"></div>
<aside id="drawer" aria-hidden="true">
  <div class="dh"><h3 id="dTitle">Evidence</h3><button id="dClose" aria-label="Close">×</button></div>
  <div class="db" id="dBody"></div>
</aside>

<script>
const $ = s => document.querySelector(s);
const el = (t, c, h) => { const e = document.createElement(t); if (c) e.className = c;
  if (h !== undefined) e.innerHTML = h; return e; };
const esc = s => String(s ?? '').replace(/[&<>"]/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const inr = n => '₹' + Number(n).toLocaleString('en-IN', {maximumFractionDigits:2});

let STATE = null, CATALOGUE = null, DRAFT = null, LASTDRAFT = null,
    ITEMCAT = 'corrugated', ROUND = null, ISSUE_OFFERED = false;

/* ---------------- boot ---------------- */
async function boot(){
  // The item master and the vendor list are needed in BOTH halves of the
  // product, so they load here rather than in enterDraft. They used to load
  // only while drafting, which meant that after the quotes arrived — the exact
  // moment a buyer wants to check what was actually asked for — those two tabs
  // opened on nothing at all.
  const [st, cat] = await Promise.all([
    fetch('/api/state').then(r => r.json()),
    fetch('/api/catalogue').then(r => r.json())]);
  STATE = st; CATALOGUE = cat;
  await refreshDraft();
  $('#chipAsm').onclick = showAssumptions;
  $('#tabs').querySelectorAll('button').forEach(
    b => b.onclick = () => openTab(b.dataset.tab));
  // The pinned artifact is the point of the screen and it is also the thing in
  // the way of the conversation. Let it fold.
  $('#fold').onclick = () => {
    const on = $('#pinned').classList.toggle('folded');
    $('#fold').title = on ? 'Show this panel' : 'Collapse this panel';
  };
  // A round that is already under way outlives the tab it was started in:
  // anyone opening the page mid-round should see where it has got to.
  try {
    ROUND = await fetch('/api/round').then(r => r.json());
    if (ROUND && ROUND.state && ROUND.state !== 'idle'){
      $('#tabRound').hidden = false;
      renderRound(ROUND);
    }
  } catch (e){ /* a round is a bonus; never block the page on it */ }
  if (STATE.phase === 'draft') enterDraft(); else await enterComparison();
}

/* The product has two halves and the screen has two states. Before an RFx
   exists there is nothing to pin, so the canvas is empty and the conversation
   is the whole surface — which is the honest shape of that half of the job. */
async function enterDraft(){
  $('#tabMain').textContent = 'RFx draft';
  $('#tabOptions').hidden = true;
  $('#meta').innerHTML = '<span>Drafting</span>';
  $('#chipAsm').hidden = true;
  $('#q').placeholder = 'Tell me what you need to buy…';
  openTab('main');
  $('#panelDraft').replaceChildren(el('div','empty',
    'No RFx yet. Say what you need to buy and I will draft the whole thing — '
    + 'or open the item master and pick the lines yourself.'));
  const t = turn('Co-pilot');
  t.appendChild(el('div','block', `<p>Tell me what you're buying and I'll draft
    the RFx — schedule, questionnaire, terms — then you change what matters.</p>`));
  suggest([
    'Annual corrugated packaging, back in two weeks',
    'Same as last year, but 30-day terms',
    'What should I gate on?',
    'Only the 3-ply boxes this quarter']);
}

async function enterComparison(){
  STATE = await (await fetch('/api/state')).json();
  const r = STATE.rfx, c = STATE.counts;
  $('#tabMain').textContent = 'Comparison';
  $('#tabOptions').hidden = false;
  $('#chipAsm').hidden = false;
  $('#q').placeholder = 'Ask about the comparison…';
  $('#meta').innerHTML = `<span>${esc(r.rfx_id)}</span>
    <span>${esc(r.required_payment_terms)}</span>
    <span>${c.unresolved} unresolved</span>`;
  const b = $('#chipReview');
  if (STATE.open_reviews){
    b.hidden = false; b.textContent = STATE.open_reviews + ' need review';
    b.onclick = showReviews;
  } else { b.hidden = true; }
  renderTable(STATE.comparison);
  openTab('main');
  greet();
}

function suggest(list){
  const s = $('#suggest'); s.replaceChildren();
  list.forEach(x => {
    const b = el('button', '', esc(x.length > 46 ? x.slice(0,44) + '…' : x));
    b.title = x; b.onclick = () => ask(x); s.appendChild(b); });
}


/* ---------------- the panels behind the tabs ----------------

   Four tabs, one artifact. The comparison and the draft share a slot because
   they are the same object at two ages — before quotes and after. The item
   master and the approved-vendor list sit beside them rather than in the chat,
   because picking a line is EDITING the RFx, not asking a question about it.

   Every click in here writes straight to /api/draft with no model call. Ticking
   twelve line items is data entry, and a co-pilot that occasionally mis-ticks
   one is strictly worse than a checkbox. The model is for the decisions. */

function openTab(name){
  const drafting = !STATE || STATE.phase === 'draft';
  $('#tabs').querySelectorAll('button').forEach(
    b => b.classList.toggle('on', b.dataset.tab === name));
  $('#tableWrap').hidden    = !(name === 'main' && !drafting);
  $('#panelDraft').hidden   = !(name === 'main' && drafting);
  if (!$('#pinned').classList.contains('folded')) $('#fold').hidden = false;
  $('#panelOptions').hidden = name !== 'options';
  $('#panelItems').hidden   = name !== 'items';
  $('#panelVendors').hidden = name !== 'vendors';
  $('#panelRound').hidden   = name !== 'round';
  // The legend explains cell states in the comparison grid. On any other tab it
  // is labelling something that is not on screen.
  $('#legend').style.visibility = (name === 'main' && !drafting) ? '' : 'hidden';
  if (name === 'items')   renderItems();
  if (name === 'vendors') renderVendors();
  if (name === 'options') renderOptionsPanel();
  if (name === 'round')   renderRound(ROUND);
}

/* The draft is read back from the server, never tracked here. Two copies of the
   RFx — one in the browser, one in SESSION — is exactly how a picker and a
   co-pilot end up disagreeing about what is going out to vendors. */
async function refreshDraft(){
  const j = await (await fetch('/api/draft')).json();
  DRAFT = j.draft; DRAFT.missing = j.missing;
  renderDraftPanel();
  if ($('#panelItems')   && !$('#panelItems').hidden)   renderItems();
  if ($('#panelVendors') && !$('#panelVendors').hidden) renderVendors();
  // The moment the RFx is complete, the buyer's next act is sending it to five
  // companies. What belongs in front of them then is the mail itself, not a
  // note saying one exists.
  if (j.phase === 'draft' && !DRAFT.missing.length && !DRAFT.issued) offerToIssue();
  return DRAFT;
}

async function patchDraft(patch){
  const j = await (await fetch('/api/draft', {method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify(patch)})).json();
  DRAFT = j.draft; DRAFT.missing = j.missing;
  renderDraftPanel();
  // Both write paths have to notice completeness: the model sets a field and
  // refreshDraft runs, a picker sets one and this does. Wiring it to only one
  // of them means the mail appears or does not depending on which way the last
  // decision happened to be made.
  if (!DRAFT.missing.length && !DRAFT.issued && !DRAFT.mail_approved) offerToIssue();
  return DRAFT;
}

function renderDraftPanel(){
  const p = $('#panelDraft');
  if (!p) return;
  if (!DRAFT || !CATALOGUE){
    p.replaceChildren(el('div','empty',
      'No RFx yet. Say what you need to buy and I will draft the whole thing — '
      + 'or open the item master and pick the lines yourself.'));
    return;
  }
  const c = CATALOGUE, d = DRAFT;
  const def = c.defaults || {};
  const vname = id => (c.vendors.find(v => v.vendor_id === id) || {}).name || id;
  const qtext = n => {
    const q = c.questions.find(x => x.q_no === n);
    if (!q) return 'Q' + n;
    // Enough to recognise the question, not the whole of it. The card is a
    // summary of the tender; the questionnaire itself is one tab away.
    const t = q.question.length > 52 ? q.question.slice(0, 50).trim() + '…' : q.question;
    return 'Q' + n + ' · ' + t;
  };
  const nLines = (d.line_nos || []).length;
  const nQs    = (d.question_nos || []).length;
  const gate   = d.gating_q_nos || [];
  const inv    = d.vendor_ids || [];
  const row = (k, v, extra) =>
    `<tr><th>${esc(k)}</th><td>${v}` +
    (extra ? `<div class="chg">${extra}</div>` : '') + `</td></tr>`;

  const box = el('div','block draft');
  box.innerHTML =
    `<div class="h">RFx draft${d.issued ? ' · issued' : ''}</div>
     <table class="draft">
      ${row('Buyer', esc(d.buyer_org || def.buyer_org || '—'))}
      ${row('Category', esc(d.category || def.category || '—'))}
      ${row('Deliver to', esc(d.delivery_point || def.delivery_point || '—'),
            esc(d.required_incoterm || def.required_incoterm || ''))}
      ${row('Payment terms', d.payment_terms_days != null
            ? esc(d.payment_terms_days + ' days from GRN')
            : '<span style="color:var(--warn)">not decided</span>',
            d.payment_terms_days != null
              ? 'Every landed cost is NPV-adjusted to this, so it decides who looks cheapest'
              : '')}
      ${row('Responses due', d.response_due ? esc(d.response_due)
            : '<span style="color:var(--warn)">not decided</span>')}
      ${row('Schedule', nLines
            ? esc(nLines + ' of ' + c.lines.length + ' item-master lines')
            : '<span style="color:var(--warn)">nothing scheduled yet</span>')}
      ${row('Questionnaire', esc(nQs + ' question' + (nQs === 1 ? '' : 's')),
            gate.length
              ? 'Disqualifying: ' + gate.map(n => esc(qtext(n))).join('<br>')
              : 'Nothing gated — price decides alone')}
      ${row('Invited', inv.length ? inv.map(id => esc(vname(id))).join(', ')
            : '<span style="color:var(--warn)">no vendors chosen</span>')}
     </table>` +
    ((d.missing || []).length
      ? `<div class="gaps">Still to decide: ${d.missing.map(esc).join(' · ')}</div>`
      : `<div class="ok">Ready to issue — the mail is in the conversation below,
           in full, with the send button on it</div>`);

  const foot = el('div','pfoot');
  const toItems = el('button','other','Choose line items');
  toItems.onclick = () => openTab('items');
  const toVend = el('button','other','Choose vendors');
  toVend.onclick = () => openTab('vendors');
  foot.appendChild(toItems); foot.appendChild(toVend);
  box.appendChild(foot);

  p.replaceChildren(box);
  $('#pinSub').textContent = nLines
    ? `${nLines} line${nLines === 1 ? '' : 's'} · ${inv.length} vendor${inv.length === 1 ? '' : 's'}`
    : 'nothing scheduled yet';
}

/* ---------------- the round ----------------

   A procurement round is not an instant. Mail goes out, replies come back one
   at a time in whatever format the vendor felt like, and for most of the week
   the buyer's real question is "where has this got to". A spinner followed by a
   finished table skips the part they actually live in.

   Every line here is true. The extraction runs per document and takes real
   time; the formats are the formats; the line counts are what came out. The one
   fiction is the send, and it says so on its own row. */

function renderRound(r){
  const p = $('#panelRound');
  if (!p) return;
  if (!r || !r.vendors || !r.vendors.length){
    p.replaceChildren(el('div','empty','No round has been issued yet.'));
    return;
  }
  const head = el('div','roundhead');
  const done = r.vendors.filter(v => v.state === 'quote read').length;
  head.innerHTML = `<b>RFx round</b><span class="st">${esc(r.state)}</span>` +
    `<span class="st">${done} of ${r.vendors.length} replies read</span>` +
    (r.started_at ? `<span class="st">sent ${esc(r.started_at)}</span>` : '');
  const t = el('table','round');
  const tb = document.createElement('tbody');
  r.vendors.forEach(v => {
    const tr = document.createElement('tr');
    tr.className = v.state === 'quote read' ? 'done'
                 : (v.state === 'mail sent' || v.state === 'awaiting reply') ? 'wait' : '';
    tr.innerHTML = `<td class="v">${esc(v.name)}</td>
      <td class="s">${esc(v.state)}</td>
      <td class="n">${esc(v.note || '')}</td>`;
    tb.appendChild(tr);
  });
  t.appendChild(tb);
  p.replaceChildren(head, t);
  if (r.error) p.appendChild(el('div','roundnote', 'Failed: ' + esc(r.error)));
  p.appendChild(el('div','roundnote',
    'The send is stubbed \u2014 no mail left the building. Everything after it is '
    + 'real work on real documents: five replies in five formats, read one at a '
    + 'time, which is why this takes as long as it does.'));
  $('#pinSub').textContent = `${done} of ${r.vendors.length} replies read`;
}

/* Offer the send as a card in the CHAT, with the mail in full.

   "\u2191 RFx draft updated above" asked the buyer to go and look, and then to
   take on trust that a mail existed. Before five companies hear from you, the
   thing to read is the actual text going out and the actual list it is going
   to. */
async function offerToIssue(){
  if (ISSUE_OFFERED) return;
  ISSUE_OFFERED = true;
  let m;
  try { m = await (await fetch('/api/mail')).json(); }
  catch (e){ ISSUE_OFFERED = false; return; }
  const t = turn('Co-pilot');
  t.appendChild(renderMail({...m, verify: true}));
  $('#chat').scrollTop = 1e9;
}

async function sendRfx(card){
  $('#tabRound').hidden = false;
  ROUND = ROUND || {state:'sending', vendors:[]};
  openTab('round');
  const res = await fetch('/api/issue', {method:'POST'});
  if (!res.ok){
    const why = await res.text();
    card && card.appendChild(el('div','status','Could not send: ' + esc(why.slice(0,200))));
    return;
  }
  const rd = res.body.getReader(); const dec = new TextDecoder(); let buf = '';
  while (true){
    const {done, value} = await rd.read(); if (done) break;
    buf += dec.decode(value, {stream:true});
    const parts = buf.split('\n\n'); buf = parts.pop();
    for (const p of parts){
      if (!p.startsWith('data: ')) continue;
      let m; try { m = JSON.parse(p.slice(6)); } catch (e){ continue; }
      if (m.kind === 'round'){ ROUND = m.payload; renderRound(ROUND); }
      if (m.kind === 'done' && m.payload.phase === 'comparison'){
        STATE = null;
        await enterComparison();
        $('#tabRound').hidden = false;
      }
    }
  }
}

/* ---------------- item master ----------------
   Five categories, one of them loaded. The four empty ones are not padding:
   they say this is one category in a buyer's catalogue rather than a demo with
   the answer hardcoded, and they say "no data" instead of inventing some. */
function renderItems(){
  const p = $('#panelItems');
  if (!CATALOGUE){ p.replaceChildren(el('div','empty','Loading the item master…')); return; }
  const cats = CATALOGUE.categories || [{key:'corrugated', name:'Corrugated packaging',
                                         lines: CATALOGUE.lines.length, note:null}];
  const cat = cats.find(c => c.key === ITEMCAT) || cats[0];
  ITEMCAT = cat.key;
  const lines = CATALOGUE.lines.filter(l => (l.category || 'corrugated') === cat.key);
  const chosen = new Set(DRAFT ? (DRAFT.line_nos || []) : []);

  const head = el('div','phead');
  const sel = el('select','catsel');
  cats.forEach(c => {
    const o = document.createElement('option');
    o.value = c.key;
    o.textContent = c.name + (c.lines ? ` (${c.lines})` : ' — empty');
    if (c.key === ITEMCAT) o.selected = true;
    sel.appendChild(o);
  });
  sel.onchange = () => { ITEMCAT = sel.value; renderItems(); };
  head.appendChild(sel);
  head.appendChild(el('span','pcount',
    lines.length ? `${chosen.size} of ${lines.length} selected` : ''));
  p.replaceChildren(head);

  if (!lines.length){
    p.appendChild(el('div','empty', esc(cat.note || 'No data available.')));
    return;
  }

  const body = el('div','pbody');
  const t = el('table','pick');
  t.innerHTML = `<thead><tr><th style="width:18px"></th><th style="width:34px">#</th>
    <th>Item</th><th class="num">Annual qty</th><th>UOM</th></tr></thead>`;
  const tb = document.createElement('tbody');
  lines.forEach(l => {
    const tr = document.createElement('tr');
    if (chosen.has(l.line_no)) tr.className = 'on';
    const tags = [l.ply ? l.ply + '-ply' : null,
                  l.food_contact ? 'food contact' : null,
                  l.requires_tooling ? 'tooling' : null].filter(Boolean).join(' · ');
    tr.innerHTML = `<td><span class="mark"></span></td>
      <td>${l.line_no}</td>
      <td>${esc(l.description)}<small>${esc(l.code)}${tags ? ' · ' + esc(tags) : ''}</small></td>
      <td class="num">${Number(l.annual_qty).toLocaleString('en-IN')}</td>
      <td>${esc(l.uom)}</td>`;
    tr.onclick = async () => {
      const next = new Set(DRAFT ? (DRAFT.line_nos || []) : []);
      next.has(l.line_no) ? next.delete(l.line_no) : next.add(l.line_no);
      tr.classList.toggle('on');                       // optimistic, so it feels instant
      await patchDraft({line_nos: [...next].sort((a,b) => a - b)});
      renderItems();
    };
    tb.appendChild(tr);
  });
  t.appendChild(tb); body.appendChild(t); p.appendChild(body);

  const foot = el('div','pfoot');
  const all = el('button','other','Select all ' + lines.length);
  all.onclick = async () => {
    const keep = (DRAFT.line_nos || []).filter(
      n => !lines.some(l => l.line_no === n));
    await patchDraft({line_nos: [...new Set([...keep, ...lines.map(l => l.line_no)])]
      .sort((a,b) => a - b)});
    renderItems();
  };
  const none = el('button','other','Clear');
  none.onclick = async () => {
    await patchDraft({line_nos: (DRAFT.line_nos || []).filter(
      n => !lines.some(l => l.line_no === n))});
    renderItems();
  };

/* ---------------- the pinned artifact ---------------- */
function renderTable(tb, flash){
  // #pinTitle went with the header cleanup and this line kept writing to it,
  // which threw and took enterComparison down with it — so the comparison grid,
  // the whole point of the screen, rendered as nothing at all. The tab is
  // already labelled "Comparison"; a title above it was the redundancy that got
  // the header cut in the first place.
  $('#pinSub').textContent = `${tb.rows.length} lines · ${tb.columns.length - 3} vendors`;
  const t = el('table');
  const thead = el('thead'); const tr = el('tr');
  tb.columns.forEach(c => { const th = el('th', c.numeric ? 'num' : '');
    th.textContent = c.label; tr.appendChild(th); });
  thead.appendChild(tr); t.appendChild(thead);
  const tbody = el('tbody');
  // Rank within the LINE, not the column: what a buyer scans for is who is
  // cheapest on this item and by how much, and a whole-table ramp would just
  // re-draw the fact that a 7-ply case costs more than a 3-ply box.
  //
  // Magnitude is carried by BAR LENGTH, not by a colour ramp, for two reasons.
  // The cell background is already spoken for by extracted / derived /
  // unresolved, and those states are the thing a buyer must never misread. And
  // a green-to-red wash would quietly rank an unresolved gap as "best", which
  // is the exact error this whole system exists to refuse.
  const CAP = 0.30;                       // 30% above the best fills the bar
  tb.rows.forEach(row => {
    const r = el('tr'); if (flash) r.className = 'flash';
    const nums = tb.columns.filter(c => c.numeric && c.key !== 'qty' && c.key !== 'line')
      .map(c => (row[c.key] || {}))
      .filter(x => typeof x.value === 'number' && x.state !== 'unresolved')
      .map(x => x.value);
    const best = nums.length ? Math.min(...nums) : null;
    tb.columns.forEach(c => {
      const cell = row[c.key] || {};
      const priced = typeof cell.value === 'number' && cell.state !== 'unresolved'
        && c.key !== 'qty' && c.key !== 'line';
      const isBest = priced && best !== null && cell.value === best && nums.length > 1;
      const td = el('td', (c.numeric ? 'num ' : '') + (c.key === 'item' ? 'item ' : '') +
        (cell.state && cell.state !== 'plain' ? 's-' + cell.state + ' ' : '') +
        (isBest ? 'best' : ''));
      // The unit goes UNDER the quantity, visibly. It was a tooltip, which is
      // the same as not being there: these thirty lines are priced per piece,
      // per kilogram, per set and per hundred pieces, and every vendor column
      // is "landed rupees per one of these". A rate column showing 8.03 above
      // 1,339.00 with the unit hidden is the exact comparison this project is
      // about not making.
      if (c.key === 'item' || c.key === 'qty'){
        td.innerHTML = esc(cell.value) + (cell.note ? `<small>${esc(cell.note)}</small>` : '');
      } else {
        td.textContent = cell.value === null || cell.value === undefined ? '—' : cell.value;
        if (priced && best && !isBest){
          const over = (cell.value - best) / best;
          const bar = el('i','rank'); bar.style.width = Math.min(over / CAP, 1) * 100 + '%';
          bar.title = `+${(over * 100).toFixed(1)}% over the best price on this line`;
          td.appendChild(bar);
        }
        if (cell.note) td.title = cell.note;
        if (cell.evidence_id){ td.onclick = () => openEvidence(cell.evidence_id); }
        else if (cell.state === 'unresolved' && cell.note) td.onclick = () => explainGap(cell.note);
      }
      r.appendChild(td);
    });
    tbody.appendChild(r);
  });
  t.appendChild(tbody);
  $('#tableWrap').replaceChildren(t);
  $('#foot').innerHTML = (tb.footnotes || []).map(esc).join(' &nbsp;·&nbsp; ');
}

/* ---------------- chat ---------------- */
function turn(who, cls){ const d = el('div', 'turn ' + (cls || ''));

async function greet(){

  // one, and leading with it is how a tool ends up being a better spreadsheet.
  try {
    const o = await (await fetch('/api/options')).json();
    if (o.cards && o.cards.length)

        cards:o.cards, note:'Landed cost per buyer unit, pre-tax, at the terms the '
          + 'RFx asked for. Lead time is the slowest vendor in the split.'}));
  } catch(e){ /* options are a bonus; never block the page on them */ }
  const t = turn('Analyst');
  const c = STATE.counts, dq = STATE.vendors.filter(v => !v.qualified);
  t.appendChild(el('div','block',`<p>Five responses in, in five formats. Every rate is
    landed to ₹ per buyer unit, pre-tax, adjusted to the ${esc(STATE.rfx.required_payment_terms)}
    the RFx asked for.</p>
    <p><b>${c.cells} cells. ${c.extracted} were comparable exactly as quoted.</b>
    ${c.derived} needed at least one assumption; ${c.unresolved} could not be derived at
    all and are shown as gaps, never as zero.</p>` +
    (dq.length ? '<p>' + dq.map(v => `<b>${esc(v.name.split(' ')[0])}</b> did not clear the
      questionnaire — ${esc((v.disqualified_because[0] || '').toLowerCase())}.`).join(' ')
      + '</p>' : '')));
  suggest([
    'Where are you unsure?',
    'Cheapest per line among vendors who cleared the questionnaire — and what does that cost versus single-sourcing?',
    'Which vendors’ certifications are actually valid?',
    'If I take that split, does anyone fall below their minimum order?',
    'Which vendor is most reliable?']);
}

async function ask(q){
  turn('You','you').appendChild(el('div','bubble', esc(q)));
  $('#q').value = '';
  const t = turn('Analyst');
  const status = el('div','status','thinking…'); t.appendChild(status);
  // A model call can legitimately take half a minute. A word that never changes
  // for half a minute reads as a hang, and the user's first instinct is to
  // reload — which loses the turn that was about to arrive. Count out loud.
  const t0 = Date.now(); let statusText = 'thinking…';
  const tick = setInterval(() => {
    const secs = Math.round((Date.now() - t0) / 1000);
    status.textContent = statusText + (secs > 3 ? `   ${secs}s` : '');
  }, 1000);
  const res = await fetch('/api/ask', {method:'POST',
    headers:{'Content-Type':'application/json'}, body: JSON.stringify({question:q})});
  const rd = res.body.getReader(); const dec = new TextDecoder(); let buf = '';
  // A model narrating each tool call often repeats itself verbatim. Say it once.
  let lastText = '';
  try {
  while (true){
    const {done, value} = await rd.read(); if (done) break;
    buf += dec.decode(value, {stream:true});
    const parts = buf.split('\n\n'); buf = parts.pop();
    for (const p of parts){
      if (!p.startsWith('data: ')) continue;
      // One block that will not render must not take the conversation down with
      // it. Before this, a single missing renderer left "thinking…" on screen
      // for ever and the only way out was a reload — which is a worse failure
      // than the bug that caused it.
      try {
      const m = JSON.parse(p.slice(6));
      if (m.kind === 'done'){ status.remove(); break; }
      if (m.kind === 'status'){ statusText = m.payload; status.textContent = m.payload; continue; }
      if (m.kind === 'issued'){ await enterComparison(); continue; }
      status.remove();
      const blk = m.payload;
      if (blk.type === 'rfx_draft'){
        // The draft IS the pinned artifact before quotes arrive — the same slot
        // the comparison takes afterwards. Putting it in the chat made a
        // transcript of stale copies, which is the exact thing the pinned
        // canvas exists to avoid.
        LASTDRAFT = blk; renderDraftPanel(); refreshDraft();
        // No "updated above" pointer any more. Either the model's own
        // sentence says what changed, or the card changed visibly; sending the
        // buyer to go and look was doing neither.
        $('#chat').scrollTop = 1e9;
        continue;
      }
      if (blk.type === 'text' && blk.text && blk.text.trim() === lastText) continue;
      if (blk.type === 'text') lastText = (blk.text || '').trim();
      t.appendChild(renderBlock(blk));
      $('#chat').scrollTop = 1e9;
      } catch (err){
        console.error('block failed', err);
        t.appendChild(el('div','block status',
          'A block did not render: ' + esc(err.message)));
      }
    }
  }
  } finally { clearInterval(tick); status.remove(); }
}

function renderBlock(b){
  if (b.type === 'text') return el('div','block', mdish(b.text));
  if (b.type === 'query') return renderQuery(b);
  if (b.type === 'table'){
    if (b.pin){ renderTable(b, true);
      return el('div','block status','↑ comparison updated in place'); }
    return el('div','block', '<em>table</em>');
  }
  if (b.type === 'chart') return renderChart(b);
  if (b.type === 'evidence'){
    const d = el('div','block');
    const btn = el('button','', 'Open ' + esc(b.doc_id) + ' · ' + esc(b.locator));
    btn.className = 'chip warn'; btn.onclick = () => openEvidence(b.evidence_id);
    d.appendChild(btn); if (b.snippet) d.appendChild(el('div','status', esc(b.snippet)));
    return d;
  }
  if (b.type === 'choice') return renderChoice(b);
  if (b.type === 'options') return renderOptions(b);
  if (b.type === 'rfx_draft') return renderDraft(b);
  if (b.type === 'mail_draft') return renderMail(b);
  if (b.type === 'review') return renderReviews(b);
  if (b.type === 'assumptions') return renderAssumptions(b);
  if (b.type === 'refusal'){
    const d = el('div','block refusal');
    d.innerHTML = `<div class="h">Not answerable from this data</div>
      <div>${esc(b.reason)}</div>` +
      (b.would_need?.length ? `<ul>${b.would_need.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>` : '');
    // If the co-pilot cannot run, the visitor is stranded on an empty chat with
    // no way to reach the half of this build that needs no model at all. Offer
    // the door rather than leaving them at a blank box.
    if (STATE && STATE.phase === 'draft'){
      const b2 = el('button','chip','Issue the template RFx instead');
      b2.onclick = async () => {
        b2.disabled = true; b2.textContent = 'reading five responses…';
        await fetch('/api/issue_default', {method:'POST'});
        STATE.phase = 'comparison';
        await enterComparison();
      };
      d.appendChild(b2);
    }
    return d;
  }
  return el('div','block status', esc(JSON.stringify(b).slice(0,200)));
}

const mdish = s => '<p>' + esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>')
  .replace(/\n\n/g,'</p><p>').replace(/\n/g,'<br>') + '</p>';

function renderChoice(b){
  // A decision the buyer clicks, with what each option costs written on it.
  // Single-select fires immediately; multi-select waits for Apply, because
  // toggling four gates one at a time would re-price the tender four times.
  const d = el('div','block choice');
  const picked = new Set(b.options.filter(o => o.selected).map(o => o.value));
  const list = el('div','opts');

  b.options.forEach(o => {
    const row = el('button','opt' + (picked.has(o.value) ? ' on' : ''));
    row.innerHTML = `<span class="mark"></span><span class="txt">${esc(o.label)}` +
      (o.consequence ? `<em>${esc(o.consequence)}</em>` : '') + `</span>`;
    row.onclick = () => {
      if (!b.multi){ send(b, [o.value]); return; }
      picked.has(o.value) ? picked.delete(o.value) : picked.add(o.value);
      row.classList.toggle('on');
      apply.hidden = false;
      apply.textContent = picked.size ? `Apply ${picked.size} selected` : 'Apply — gate on nothing';
    };
    list.appendChild(row);
  });

  d.innerHTML = `<div class="h">${esc(b.title)}</div>`;
  d.appendChild(list);
  if (b.note) d.appendChild(el('div','cnote', esc(b.note)));

  const foot = el('div','foot');
  const apply = el('button','go'); apply.hidden = !b.multi;
  apply.textContent = picked.size ? `Apply ${picked.size} selected` : 'Apply';
  apply.onclick = () => send(b, [...picked]);
  foot.appendChild(apply);

  if (b.allow_other){
    const other = el('button','other', 'Something else…');
    other.onclick = () => { $('#q').focus();
      if (b.other_hint) $('#q').placeholder = b.other_hint; };
    foot.appendChild(other);
  }
  d.appendChild(foot);

  /* A click writes to the draft FIRST, then tells the co-pilot.

     The obvious shape is to send the sentence and let the model apply it, and
     it mostly works — but "45 days from GRN" has to survive a round trip
     through a model before it reaches the field that re-prices 139 cells, and
     "mostly" is not the word you want on that path. The picker knows exactly
     which field it edits, so it edits it: the card updates instantly, the draft
     is right whatever the model does next, and the model's job shrinks to the
     part it is good at — saying what this changed and what to decide next. */
  async function send(blk, values){
    if (blk.key === 'lines' && values[0] === 'pick'){ openTab('items'); return; }
    const labels = values.map(v =>
      (blk.options.find(o => o.value === v) || {}).label || v);
    d.querySelectorAll('button').forEach(x => x.disabled = true);
    d.classList.add('done');

    const patch = {};
    if (blk.key === 'payment_terms' && /^\d+$/.test(values[0]))
      patch.payment_terms_days = Number(values[0]);
    else if (blk.key === 'gates')
      patch.gating_q_nos = values.map(Number).filter(n => !isNaN(n));
    else if (blk.key === 'vendors')
      patch.vendor_ids = values;
    else if (blk.key === 'lines' && CATALOGUE){
      const all = CATALOGUE.lines;
      if (values[0] === 'all') patch.line_nos = all.map(l => l.line_no);
      else if (values[0] === '3' || values[0] === '5')
        patch.line_nos = all.filter(l => String(l.ply) === values[0]).map(l => l.line_no);
    }
    if (Object.keys(patch).length){
      try { await patchDraft(patch); } catch (e){ console.error('draft patch', e); }
    }
    ask(`${blk.title}: ${labels.length ? labels.join('; ') : 'none'}`);
  }
  return d;
}

const inr0 = n => '\u20B9' + Math.round(n).toLocaleString('en-IN');

function renderOptions(b){
  const d = el('div','block options');
  const base = (b.cards.find(c => c.kind === 'cheapest') || {}).total_inr;
  d.innerHTML = `<div class="h">${esc(b.title)}</div><div class="cards">` +
    b.cards.map(c => {
      const delta = (base != null && c.total_inr !== base)
        ? `<span class="delta">+${inr0(c.total_inr - base)}</span>` : '';
      return `<div class="card ${c.feasible ? '' : 'bad'}">
        <div class="lbl">${esc(c.label)}</div>
        <div class="cost">${inr0(c.total_inr)} ${delta}</div>
        <div class="facts">
          <span>${c.lead_time_days != null ? c.lead_time_days + ' days' : 'lead time unstated'}</span>
          <span>${c.vendors.length} vendor${c.vendors.length === 1 ? '' : 's'}</span>
          <span>${c.lines_covered}/${c.lines_total} lines</span>
        </div>
        <div class="who">${c.vendor_names.map(esc).join(' · ')}</div>
        <div class="why">${esc(c.why)}</div>` +
        (c.violations.length
          ? `<ul class="viol">${c.violations.slice(0,2).map(v=>`<li>${esc(v)}</li>`).join('')}</ul>`
          : '') + `</div>`;
    }).join('') + '</div>' +
    (b.note ? `<div class="note">${esc(b.note)}</div>` : '');
  const btn = el('button','chip','Award memo');

}

async function showMemo(){

/* Deliberately small: headings, bold, bullets, rules. The memo is markdown
   because it has to leave this tool and land in an email or a board pack. */
const mdDoc = src => esc(src)
  .replace(/^### (.+)$/gm, '<h5>$1</h5>')
  .replace(/^## (.+)$/gm, '<h4>$1</h4>')
  .replace(/^# (.+)$/gm, '<h3>$1</h3>')
  .replace(/^\s*[-*] (.+)$/gm, '<li>$1</li>')
  .replace(/(<li>[\s\S]*?<\/li>)(?!\s*<li>)/g, '<ul>$1</ul>')
  .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>')
  .replace(/^---$/gm, '<hr>')
  .replace(/\n{2,}/g, '</p><p>');

function renderDraft(b){
  const d = el('div','block draft');
  const rows = b.fields.map(f =>
    `<tr><th>${esc(f.label)}</th><td>${esc(f.value)}` +
    (f.changes ? `<div class="chg">${esc(f.changes)}</div>` : '') + `</td></tr>`).join('');
  d.innerHTML = `<div class="h">${esc(b.title)}</div>
    <table class="draft">${rows}
      <tr><th>Schedule</th><td>${b.lines_included} of ${b.lines_available} item-master lines</td></tr>
      <tr><th>Questionnaire</th><td>${b.questions_included} questions` +
      (b.gating.length
        ? `<div class="chg">Disqualifying: ${b.gating.map(esc).join(' · ')}</div>`
        : `<div class="chg">Nothing gated — price decides alone</div>`) + `</td></tr>
      <tr><th>Invited</th><td>${b.vendors.length ? b.vendors.map(esc).join(', ') : '—'}</td></tr>
    </table>` +
    (b.missing.length
      ? `<div class="gaps">Still to decide: ${b.missing.map(esc).join(' · ')}</div>`
      : `<div class="ok">Ready to issue</div>`);
  return d;
}

function renderMail(b){
  const d = el('div','block mail');
  const n = (b.to || []).length;
  d.innerHTML = `<div class="h">Covering mail \u2014 exactly what goes out</div>
    <table class="draft">
      <tr><th>To</th><td>${(b.to||[]).map(esc).join(', ')}</td></tr>
      <tr><th>Subject</th><td>${esc(b.subject)}</td></tr>
      <tr><th>Attached</th><td>${(b.attachments||[]).map(a=>'\uD83D\uDCCE '+esc(a)).join('<br>')}</td></tr>
    </table>
    <pre class="mailbody mailfull">${esc(b.body)}</pre>
    <div class="stub">${esc(b.stub_note || '')}</div>` +
    (b.verify
      ? `<div class="verify">Before this goes out, the two things worth checking
         are the <b>line schedule</b> and the <b>vendor list</b> \u2014 everything
         else you can change after the quotes land, and those two you cannot.</div>`
      : '');

  /* Sending is a BUTTON, and the server refuses without the approval it writes.
     Before this the co-pilot could draft a mail and issue it in the same turn,
     which made "a covering mail they approve" a sentence in a README rather
     than a step anybody took. Re-drafting clears the approval, so an edit
     cannot ride out on the last one. */
  const foot = el('div','rfoot');
  const go = el('button','go', n ? `Send to ${n} vendor${n===1?'':'s'}` : 'Send');
  go.onclick = async () => {
    [...foot.querySelectorAll('button')].forEach(x => x.disabled = true);
    go.textContent = 'sending\u2026';
    await patchDraft({mail_approved: true});
    await sendRfx(d);
  };
  const items = el('button','other','Check the line items');
  items.onclick = () => { $('#pinned').classList.remove('folded'); openTab('items'); };
  const vend = el('button','other','Check the vendors');
  vend.onclick = () => { $('#pinned').classList.remove('folded'); openTab('vendors'); };
  const edit = el('button','other','Change the wording');
  edit.onclick = () => { $('#q').focus();
    $('#q').placeholder = 'e.g. ask for the drawing revision in the subject line'; };
  foot.appendChild(go); foot.appendChild(items);
  foot.appendChild(vend); foot.appendChild(edit);
  d.appendChild(foot);
  return d;
}

function renderQuery(b){
  // Collapsed and labelled "computed", not "SQL". A buyer does not need to read
  // a query to trust a number, but a VP challenging one needs it to exist — so
  // it is one click away and never the headline.
  const src = b.sql || b.code || '';
  const typed = /^[a-z_]+\(/.test(src) && !/\bselect\b/i.test(src);
  const d = el('details','qry');
  d.appendChild(el('summary','',
    (typed ? esc(src.replace(/\(.*$/, '')) : 'computed') + ` · ${b.row_count} rows`));
  d.appendChild(el('pre','', esc(src)));
  return d;
}

function renderChart(b){
  const w = 640, h = 210, pad = 44, n = b.categories.length;
  const all = b.series.flatMap(s => s.values); const max = Math.max(...all, 1);
  const bw = (w - pad*2) / n * 0.62;
  let bars = '', labels = '', ticks = '';
  for (let i=0;i<4;i++){ const v = max*i/3, y = h - pad - (h-pad*1.5)*(i/3);
    ticks += `<line x1="${pad}" x2="${w-8}" y1="${y}" y2="${y}" stroke="currentColor"
      stroke-opacity=".12"/><text x="${pad-6}" y="${y+3}" text-anchor="end">${
      Math.round(v).toLocaleString('en-IN')}</text>`; }
  b.categories.forEach((c,i) => {
    const x = pad + (w-pad*2)*(i+0.5)/n;
    b.series.forEach((s,j) => {
      const v = s.values[i] ?? 0, hh = (h-pad*1.5)*(v/max);
      const bx = x - bw/2 + (j*bw/b.series.length);
      bars += `<rect x="${bx}" y="${h-pad-hh}" width="${bw/b.series.length - 2}"
        height="${Math.max(hh,1)}" fill="var(--accent)" fill-opacity="${1-j*0.35}"/>`; });
    labels += `<text x="${x}" y="${h-pad+13}" text-anchor="middle">${esc(c).slice(0,11)}</text>`; });
  const d = el('div','block');
  d.innerHTML = `<div class="who">${esc(b.title)}</div>
    <svg class="chart" viewBox="0 0 ${w} ${h}" style="width:100%;max-width:${w}px;color:var(--ink-soft)">
    ${ticks}${bars}${labels}</svg>`;
  return d;
}

function renderReviews(b){
  const d = el('div','block');
  d.appendChild(el('div','who', esc(b.title)));

  /* Twenty-eight cells, three reasons. A buyer can hold three decisions; they
     cannot hold twenty-eight, so they accept all twenty-eight — which is the
     failure this queue exists to prevent, arriving by another door. The cells
     are still all here, one click away, and correcting is still per cell:
     accepting a group says "this convention is right", which is one judgement
     about one thing. "Every one of these rates is the same wrong number" never
     is, so there is no bulk correct. */
  (b.groups || []).forEach(g => {
    const box = el('div','rgroup');
    box.innerHTML =
      `<div class="top"><b>${esc(g.title)}</b>` +
      `<span class="n">${g.count} cell${g.count===1?'':'s'}</span>` +
      `<span class="conf">${(g.confidence_min*100).toFixed(0)}–${(g.confidence_max*100).toFixed(0)}%</span></div>` +
      `<div class="why">${esc(g.why)}</div>` +
      `<div class="who2">${g.vendors.map(esc).join(' · ')}</div>`;
    const foot = el('div','rfoot');
    const all = el('button','go', `Accept all ${g.count}`);
    all.onclick = async () => {
      all.disabled = true; all.textContent = 'accepting…';
      const r = await (await fetch('/api/reviews/accept', {method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({review_ids: g.cards.map(c => c.review_id)})})).json();
      box.classList.add('done');
      foot.replaceChildren(el('div','status',
        `${g.count} accepted on one judgement — recorded against each cell.`));
      const chip = $('#chipReview');
      if (r.open){ chip.textContent = r.open + ' need review'; } else { chip.hidden = true; }
    };
    const open = el('button','other', 'Show the cells');
    let shown = false;
    const list = el('div','rcells'); list.hidden = true;
    g.cards.forEach(c => list.appendChild(reviewCard(c)));
    open.onclick = () => { shown = !shown; list.hidden = !shown;
      open.textContent = shown ? 'Hide the cells' : 'Show the cells'; };
    foot.appendChild(all); foot.appendChild(open);
    box.appendChild(foot); box.appendChild(list);
    d.appendChild(box);
  });

  b.cards.forEach(c => d.appendChild(reviewCard(c)));
  if (b.remaining) d.appendChild(el('div','status', `${b.remaining} more in the queue.`));
  return d;
}

function reviewCard(c){
  {
    const card = el('div','card');
    card.innerHTML = `<div class="top"><b>${esc(c.vendor_id)}</b>
      <span class="mono" style="font-size:11px;color:var(--ink-faint)">line ${c.line_no ?? '—'} · ${esc(c.field)}</span>
      <span class="conf">${(c.confidence*100).toFixed(0)}%</span></div>
      <div class="mono" style="font-size:12px">${esc(c.proposed_value ?? '—')}</div>
      <div class="why">${esc(c.reason || 'Below the confidence threshold.')}</div>`;
    const accept = el('button','','Accept');
    accept.onclick = () => decide(c.review_id, 'accept', null, card);
    const fix = el('button','','Correct…');
    // Inline, not window.prompt. The correction a human types here is the input
    // to the trust layer — it re-runs normalisation and moves the number on the
    // grid — so it deserves to look like part of the product rather than a
    // browser dialog that blocks the page while it is open.
    fix.onclick = () => {
      if (card.querySelector('.fixrow')) return;
      const row = el('div','fixrow');
      const inp = document.createElement('input');
      inp.value = c.proposed_value ?? '';
      inp.setAttribute('aria-label', 'Corrected value');
      const ok = el('button','go','Save'), no = el('button','','Cancel');
      ok.onclick = () => { const v = inp.value.trim();
        if (v) decide(c.review_id, 'correct', v, card); row.remove(); };
      no.onclick = () => row.remove();
      inp.onkeydown = e => { if (e.key === 'Enter') ok.onclick();
                             else if (e.key === 'Escape') no.onclick(); };
      row.appendChild(inp); row.appendChild(ok); row.appendChild(no);
      card.appendChild(row); inp.focus(); inp.select();
    };
    const ev = el('button','','Source');
    ev.onclick = () => openEvidence(c.evidence_id);
    card.appendChild(accept); card.appendChild(fix);
    if (c.evidence_id) card.appendChild(ev);
    return card;
  }
}

async function decide(id, action, value, card){
  const r = await (await fetch('/api/review/' + id, {method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({action, value})})).json();
  card.style.opacity = .45;
  card.querySelectorAll('button').forEach(b => b.disabled = true);
  card.appendChild(el('div','status', action === 'accept' ? 'accepted' : 'corrected'));
  const chip = $('#chipReview');
  if (r.open){ chip.textContent = r.open + ' need review'; } else { chip.hidden = true; }
}

function renderAssumptions(b){
  const d = el('div','block');
  d.appendChild(el('div','who', esc(b.title)));
  const t = el('table','asm');
  b.rows.forEach(r => {
    const tr = el('tr');
    tr.innerHTML = `<td>${esc(r.label)}</td>
      <td class="mono">${esc(r.value)}${r.unit ? ' ' + esc(r.unit) : ''}</td>
      <td style="color:var(--ink-faint);font-size:11px">${esc(r.source)}</td>`;
    t.appendChild(tr);
  });
  d.appendChild(t);
  if (b.note) d.appendChild(el('div','status', esc(b.note)));
  return d;
}

async function showReviews(){
  const r = await (await fetch('/api/reviews')).json();
  const t = turn('Review queue');
  const card = i => ({review_id:i.id, vendor_id:i.vendor_id, line_no:i.line_no,
    field:i.field, proposed_value:i.proposed_value, confidence:i.confidence,
    evidence_id:i.evidence_id,
    reason: i.missing_fact || i.match_rationale || i.unresolved_reason});
  t.appendChild(renderReviews({
    title: `${r.open} cells below the ${r.threshold} threshold — `
         + `${(r.groups||[]).length} decision${(r.groups||[]).length===1?'':'s'}`,
    groups: (r.groups || []).map(g => ({...g, cards: g.items.map(card)})),
    cards: []}));
  $('#chat').scrollTop = 1e9;
}

async function showAssumptions(){
  const r = await (await fetch('/api/assumptions')).json();
  const t = turn('Assumptions');
  t.appendChild(renderAssumptions({title:'Assumptions in force',
    rows: r.rows, note:'Every derived number rests on these.'}));
  // Provenance lives here rather than in the header. A viewer who assumes a
  // model read these documents when a fixture did has been misled by omission —
  // so it is still disclosed, and still one click away, but it no longer
  // shouts a warning at everyone who opens the page.
  if (STATE && STATE.provenance) showProvenanceInto(t, STATE.provenance);
}

function showProvenanceInto(t, prov){
  const runs = (prov.runs || []).map(r =>
    `<tr><td class="mono">${esc(r.vendor_id)}</td><td class="mono">${esc(r.extractor)}</td>
     <td class="mono">${esc(r.model)}</td><td class="mono">${r.lines} lines</td>
     <td class="mono">${esc(r.recorded_at)}</td></tr>`).join('');
  t.appendChild(el('div','block derivation',
    `<h4>Where these numbers came from</h4><div>${esc(prov.detail)}</div>` +
    (runs ? `<table class="prov"><thead><tr><th>vendor</th><th>parser</th>
             <th>model</th><th>read</th><th>recorded</th></tr></thead>
             <tbody>${runs}</tbody></table>` : '')));
}

function explainGap(note){
  const t = turn('Analyst');
  t.appendChild(el('div','block refusal',
    `<div class="h">This cell is empty on purpose</div><div>${esc(note)}</div>`));
}

/* ---------------- evidence drawer ---------------- */
async function openEvidence(id){
  if (!id) return;
  const res = await fetch('/api/evidence/' + id);
  if (!res.ok){
    $('#dTitle').textContent = 'No source on file';
    $('#dBody').replaceChildren(el('div','derivation',
      `<h4>Nothing to open</h4><div>This cell has no evidence record
       (<span class="mono">${esc(id)}</span>). That happens when a value was
       supplied by a human correction rather than read from a document — the
       correction is recorded in the review log instead.</div>`));
    $('#drawer').classList.add('open'); $('#scrim').classList.add('on');
    return;
  }
  const e = await res.json();
  $('#dTitle').textContent = e.doc_id;
  const b = $('#dBody'); b.replaceChildren();

  const kv = el('div','kv');
  const cell = e.cell || {}, q = e.quote || {};
  kv.innerHTML =
    `<div><span>Locator</span><b class="mono">${esc(e.locator)}</b></div>` +
    (q.vendor_label ? `<div><span>Vendor calls it</span><b>${esc(q.vendor_label)}</b></div>` : '') +
    (cell.as_quoted ? `<div><span>As quoted</span><b class="mono">${esc(cell.as_quoted)}</b></div>` : '') +
    (cell.landed_inr != null ? `<div><span>Landed</span><b class="mono">${inr(cell.landed_inr)}</b></div>` : '') +
    (cell.state ? `<div><span>State</span><b>${esc(cell.state)}</b></div>` : '') +
    (cell.extraction_confidence != null ?
      `<div><span>Confidence</span><b class="mono">extract ${(cell.extraction_confidence*100).toFixed(0)}% ·
       match ${(cell.match_confidence*100).toFixed(0)}%</b></div>` : '');
  b.appendChild(kv);

  if (q.match_rationale){
    const d = el('div','derivation');
    d.innerHTML = `<h4>Why this line</h4><div>${esc(q.match_rationale)}</div>`;
    b.appendChild(d);
  }
  if (cell.caveats?.length){
    const d = el('div','derivation');
    d.innerHTML = `<h4>How it was derived</h4><ul>${
      cell.caveats.map(c => `<li>${esc(c)}</li>`).join('')}</ul>`;
    b.appendChild(d);
  }
  if (cell.missing_fact){
    const d = el('div','derivation');
    d.innerHTML = `<h4>Why it is empty</h4><div>${esc(cell.unresolved_reason || '')}</div>
      <div style="margin-top:6px"><b>Needs:</b> <span class="mono">${esc(cell.missing_fact)}</span></div>`;
    b.appendChild(d);
  }

  b.appendChild(el('div','who','Source document'));
  if (e.kind === 'image'){
    const img = el('img'); img.src = e.url; img.alt = e.doc_id; b.appendChild(img);
    const m = /crop:([\d.]+),([\d.]+),([\d.]+),([\d.]+)/.exec(e.locator);
    if (m) b.appendChild(el('div','status',
      `Region ${(+m[2]*100).toFixed(0)}% down the page, ${(+m[4]*100).toFixed(1)}% tall.`));
  } else if (e.kind === 'pdf'){
    const f = el('iframe'); f.src = e.url + '#page=' +
      (/^p(\d+)/.exec(e.locator)?.[1] || 1); b.appendChild(f);
  } else {
    // Everything else renders in place too. A download link here was the last
    // point where checking a number meant leaving the screen.
    const ph = el('div','status','reading ' + esc(e.doc_id) + '…');
    b.appendChild(ph);
    fetch('/api/doc/' + encodeURIComponent(e.doc_id) + '/preview?locator='
          + encodeURIComponent(e.locator || ''))
      .then(r => r.json())
      .then(d => ph.replaceWith(renderSource(d)))
      .catch(() => ph.textContent = 'Could not read ' + e.doc_id);
  }
  $('#drawer').classList.add('open'); $('#scrim').classList.add('on');
  $('#drawer').setAttribute('aria-hidden','false');
}
function renderSource(d){
  const wrap = el('div','src');
  if (d.kind === 'mail'){
    wrap.innerHTML =
      '<table class="draft">' + (d.headers||[]).map(([k,v]) =>
        `<tr><th>${esc(k)}</th><td>${esc(v)}</td></tr>`).join('') + '</table>' +
      `<pre class="mailbody">${esc(d.body || '')}</pre>` +
      ((d.attachments||[]).length
        ? `<div class="attach">${d.attachments.map(a=>'📎 '+esc(a)).join('  ')}</div>` : '');
    return wrap;
  }
  if (d.kind === 'sheet'){
    (d.sheets||[]).forEach(sh => {
      const focused = sh.name === d.focus_sheet;
      const det = el('details','sheet'); det.open = focused;
      const hid = sh.hidden_rows && sh.hidden_rows.length
        ? ` · ${sh.hidden_rows.length} hidden row${sh.hidden_rows.length>1?'s':''}` : '';
      det.appendChild(el('summary','', esc(sh.name) + hid +
        (focused ? ' · cited here' : '')));
      const t = el('table','grid');
      (sh.rows||[]).forEach(r => {
        const tr = el('tr');
        r.forEach(c => {
          const td = el('td', (c.hidden ? 'hid ' : '') +
            (c.ref === d.focus_cell && focused ? 'hit' : ''));
          td.textContent = c.v; tr.appendChild(td);
        });
        t.appendChild(tr);
      });
      det.appendChild(t);
      if (hid) det.appendChild(el('div','status',
        'Hidden rows are shown greyed. Superseded lines get hidden rather than '
        + 'deleted, which is why they are worth seeing.'));
      wrap.appendChild(det);
    });
    return wrap;
  }
  if (d.kind === 'prose'){
    wrap.innerHTML = (d.paragraphs||[]).map(x =>
      x.type === 'h' ? `<h5>${esc(x.text)}</h5>` : `<p>${esc(x.text)}</p>`).join('');
    (d.tables||[]).forEach(rows => {
      const t = el('table','grid');
      rows.forEach((r,i) => {
        const tr = el('tr');
        if (d.focus_row != null && i === d.focus_row) tr.className = 'hit';
        r.forEach(c => { const td = el('td'); td.textContent = c; tr.appendChild(td); });
        t.appendChild(tr);
      });
      wrap.appendChild(t);
    });
    return wrap;
  }
  wrap.appendChild(el('div','status', d.message || 'No preview for this file type.'));
  return wrap;
}

function closeDrawer(){ $('#drawer').classList.remove('open');
  $('#scrim').classList.remove('on'); $('#drawer').setAttribute('aria-hidden','true'); }
$('#dClose').onclick = closeDrawer; $('#scrim').onclick = closeDrawer;
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDrawer(); });

$('#f').onsubmit = e => { e.preventDefault();
  const v = $('#q').value.trim(); if (v) ask(v); };

boot();
</script>
